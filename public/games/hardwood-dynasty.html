<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardwood Dynasty — College Basketball Coach Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120E09; --panel:#1E1710; --panel2:#171008; --inset:#0C0805;
  --line:#3A2D1D; --line2:#4E3D27;
  --ink:#F4ECDC; --muted:#A6906E; --dim:#79674C;
  --amber:#FFB02E; --amber2:#C77E1E; --banner:#A33B2E;
  --win:#8FC177; --loss:#E07A63; --gold:#E8C468; --blue:#7FB0D8;
  --cyan:#5CC8FF; --violet:#B49AE0; --teal:#5FBFA8; --rose:#E888A8; --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif; font-size:15px; line-height:1.45;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 96px),
    linear-gradient(180deg,#16110B 0%, #120E09 30%);
  min-height:100vh;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 14px 90px}
h1,h2,h3,.disp{font-family:'Big Shoulders Display',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.mono{font-family:'Chivo Mono',monospace}
a{color:var(--amber)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .amber{color:var(--amber)}
.good{color:var(--win)} .bad{color:var(--loss)} .gold{color:var(--gold)}
.sm{font-size:12.5px} .xs{font-size:11px}
.right{text-align:right} .center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:12px}

/* ---------- scoreboard header (signature) ---------- */
.sbwrap{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0D0906 0%,#120D08 100%);border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.sb{max-width:1060px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:'Big Shoulders Display';font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:'Instrument Sans';font-weight:600;font-size:9.5px;letter-spacing:.28em;color:var(--muted);margin-top:2px}
.sb-cells{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.sb-cell{background:var(--inset);border:1px solid #2A2013;border-radius:4px;padding:5px 10px 6px;min-width:64px;text-align:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}
.sb-lbl{font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;font-weight:600}
.led{font-family:'Chivo Mono',monospace;font-weight:700;font-size:17px;color:var(--amber);text-shadow:0 0 9px rgba(255,176,46,.5);line-height:1.15;white-space:nowrap}
.led.g{color:var(--win);text-shadow:0 0 9px rgba(143,193,119,.45)}
.led.r{color:var(--loss);text-shadow:0 0 9px rgba(224,122,99,.45)}
.sb-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- nav ---------- */
.nav{max-width:1060px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{font-family:'Big Shoulders Display';font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:9px 11px 7px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}

/* ---------- buttons ---------- */
.btn{font-family:'Big Shoulders Display';font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px;border-radius:4px;cursor:pointer;padding:9px 16px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn-p{background:linear-gradient(180deg,#FFC050,#E89A22);border-color:#8A5D14;color:#241703;box-shadow:0 2px 0 #7A5211, inset 0 1px 0 rgba(255,255,255,.4)}
.btn-p:hover{filter:brightness(1.05)}
.btn-g{background:transparent;border-color:var(--line2);color:var(--muted)}
.btn-g:hover{color:var(--ink);border-color:var(--amber2)}
.btn-sm{font-size:12.5px;padding:5px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{border-color:#6E2C20;color:var(--loss)}

/* ---------- cards / layout ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:14px}
.card-t{font-family:'Big Shoulders Display';font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-t .rule{flex:1;height:1px;background:var(--line)}
.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--amber2);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.tblwrap.scrollcue{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent 100%)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid #2A2114;white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{font-family:'Chivo Mono';font-size:12.5px}
.tbl tr.hl td{background:rgba(255,176,46,.07)}
.tbl th.right,.tbl td.right{text-align:right}

/* ---------- misc components ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.tdot{width:15px;height:15px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.stars{color:var(--gold);letter-spacing:.05em;font-size:12px}
.stars .off{color:#4A3B26}
.meter{height:9px;background:var(--inset);border:1px solid #2A2013;border-radius:5px;overflow:hidden}
.meter-f{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--amber2),var(--amber));transition:width .3s}
.meter-f.hot{background:linear-gradient(90deg,#B04A2E,#E4643C)}
.meter-f.cool{background:linear-gradient(90deg,#4E7A3E,#8FC177)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.pill-win{background:#22331B;color:var(--win)} .pill-loss{background:#3A1F18;color:var(--loss)}
.pill-amb{background:#3A2A10;color:var(--amber)} .pill-mut{background:#241C11;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;padding:1px 6px;border-radius:3px;text-transform:uppercase;margin-left:6px}
.tag-gem{background:#12333A;color:#6FD3E8}
.tag-bust{background:#3A1A12;color:#E08A63}
.tag-gen{background:linear-gradient(90deg,#5A3D00,#8A6200);color:#FFE9A8;border:1px solid #C7962B}
.tag-walk{background:#241C11;color:var(--dim)}
.tag-out{background:#332312;color:#E8B15C}
.news-i{padding:8px 0;border-bottom:1px dashed #2E2415;font-size:13.5px}
.news-i:last-child{border-bottom:none}
.news-wk{font-family:'Chivo Mono';font-size:10.5px;color:var(--dim);margin-right:8px}
.evcard{border-color:#7E2C22;background:linear-gradient(180deg,#2A1712,#1E1710)}
.beat{padding:5px 0 5px 12px;border-left:2px solid #3A2D1D;font-size:13.5px;margin:2px 0 2px 4px}
.bk-gm.me{border-color:var(--amber);background:rgba(255,176,46,.07)}
.rowline.me{background:rgba(255,176,46,.08);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:4px}
.headline{font-family:'Big Shoulders Display';font-weight:800;font-size:19px;letter-spacing:.03em;line-height:1.28;padding:8px 0;border-bottom:1px solid #2A2114}
.headline:last-child{border-bottom:none}
.headline.big{font-size:23px}
.kick{display:inline-block;font-family:'Chivo Mono';font-size:9.5px;letter-spacing:.14em;border-radius:3px;padding:1px 6px;margin-right:8px;vertical-align:2px}
.hl-wk{font-family:'Chivo Mono';font-size:10px;color:var(--dim);margin-left:8px;letter-spacing:0}
.card{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 26px rgba(0,0,0,.4);transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:hover{border-color:#4A3A24;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px rgba(0,0,0,.48)}
.tbl tr{transition:background .12s ease}
.tbl tr:hover td{background:rgba(255,176,46,.055)}
.tab{transition:color .16s ease}
.tab.on{text-shadow:0 0 14px rgba(255,176,46,.5)}
.btn{transition:transform .1s var(--ease),filter .15s ease,border-color .15s ease,box-shadow .15s ease,background .15s ease}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn-p{background:linear-gradient(155deg,#FFD37A,#FFB02E 55%,#F09A22);box-shadow:0 3px 16px rgba(255,176,46,.32),0 0 0 1px rgba(255,211,122,.25) inset}
.btn-p:hover{filter:brightness(1.08);box-shadow:0 4px 20px rgba(255,176,46,.42),0 0 0 1px rgba(255,211,122,.3) inset}
.btn:focus-visible,.effbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.chip{transition:border-color .15s ease,color .15s ease,background .15s ease}
.chip:hover{border-color:var(--amber2);color:var(--ink)}
.badge.click{cursor:pointer;transition:opacity .12s ease}
.badge.click:hover{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;opacity:.92}
.effbtn{transition:border-color .12s ease,color .12s ease,transform .1s ease}
.effbtn:active:not(:disabled){transform:scale(.92)}
.meter-f.legend{background:linear-gradient(90deg,#8A6BC7,var(--violet))}
.tdot{transition:transform .15s ease}
.rowline{transition:background .12s ease}
.post{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:linear-gradient(165deg,#241A12,#1C140D);transition:border-color .15s ease}
.post:hover{border-color:#4A3A24}
.post .ph{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.post .pav{width:26px;height:26px;border-radius:50%;flex:0 0 26px;box-shadow:0 0 0 2px #0009 inset}
.post .phandle{font-weight:700;font-size:13.5px}
.post .pmeta{font-family:'Chivo Mono';font-size:10px;color:var(--dim)}
.post .ptxt{font-size:14px;line-height:1.45}
.post .peng{font-family:'Chivo Mono';font-size:11px;color:var(--dim);margin-top:6px;display:flex;gap:16px}
.post.riv{border-color:#5A2A22;background:linear-gradient(180deg,#241412,#1D1210)}
.vcheck{color:#5CC8FF;font-size:11px;margin-left:4px}
.ovl{position:fixed;inset:0;background:rgba(8,5,3,.72);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:46px 14px;overflow:auto}
.ovl .panel{max-width:640px;width:100%;background:linear-gradient(180deg,#251C13,#1E1710);border:1px solid #3A2D1D;border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pennant{position:relative;overflow:hidden}
.pennant:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent)}
.ovl{animation:ovlin .18s var(--ease)}
@keyframes ovlin{from{opacity:0}to{opacity:1}}
.ovl .panel{animation:panelin .2s var(--ease)}
@keyframes panelin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.fanbar{display:flex;align-items:center;gap:10px}
.fanbar .fnum{font-family:'Big Shoulders Display';font-weight:800;font-size:28px;color:var(--gold)}
.fantrend.up{color:var(--win)} .fantrend.down{color:var(--loss)} .fantrend.flat{color:var(--dim)}
.favrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #241C12}
.favrow:last-child{border-bottom:none}
.favtag{font-family:'Chivo Mono';font-size:9.5px;letter-spacing:.1em;color:var(--teal);border:1px solid #2C4B44;background:rgba(95,191,168,.08);border-radius:3px;padding:1px 6px}
.analyst{border-left:2px solid var(--cyan)}
.analyst .phandle{color:var(--cyan)}
.inp{width:100%;max-width:360px;background:#171009;border:1px solid #3A2D1D;color:var(--ink);border-radius:8px;padding:9px 12px;font-family:'Instrument Sans';font-size:14px;margin-top:6px}
.inp:focus{outline:none;border-color:var(--amber)}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.importbox{border:1px dashed var(--line2);border-radius:10px;padding:12px;margin-top:8px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #271E11}
.rowline:last-child{border-bottom:none}

/* ---------- pennants / plaques ---------- */
.rafters{display:flex;gap:10px;flex-wrap:wrap;padding:8px 4px 2px}
.pennant{width:74px;text-align:center;font-family:'Big Shoulders Display';font-weight:800;color:#F6E7C8;background:linear-gradient(180deg,var(--banner),#7E2C22);clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);padding:9px 4px 26px;font-size:13px;letter-spacing:.05em;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pennant.conf{background:linear-gradient(180deg,#28415E,#1B2C40)}
.pennant small{display:block;font-family:'Instrument Sans';font-weight:600;font-size:8px;letter-spacing:.14em;opacity:.75;margin-top:2px}
.plaque{background:linear-gradient(180deg,#251B0F,#1C140B);border:1px solid #4E3B20;border-radius:5px;padding:11px 13px;margin-top:10px;box-shadow:inset 0 0 24px rgba(0,0,0,.45)}
.plaque .nm{font-family:'Big Shoulders Display';font-weight:800;font-size:17px;letter-spacing:.05em;color:var(--gold)}

/* ---------- bracket ---------- */
.bk-gm{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid #2A2114;border-radius:4px;margin-top:6px;background:var(--panel2);font-size:13px}
.bk-seed{font-family:'Chivo Mono';font-size:10.5px;color:var(--dim);width:18px;text-align:right}
.bk-w{font-weight:700;color:var(--ink)} .bk-l{color:var(--dim)}
.bk-sc{font-family:'Chivo Mono';font-size:12.5px;margin-left:auto;color:var(--amber)}
.regionh{font-family:'Big Shoulders Display';font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--amber2);margin-top:12px;text-transform:uppercase}

/* ---------- wizard / title ---------- */
.titlehero{padding:64px 0 26px;text-align:center}
.titlehero h1{font-size:min(15vw,92px);font-weight:800;line-height:.92;text-shadow:0 0 34px rgba(255,176,46,.16)}
.titlehero h1 span{color:var(--amber)}
.titlehero .sub{letter-spacing:.34em;color:var(--muted);font-size:11px;text-transform:uppercase;margin-top:12px;font-weight:600}
.courtline{height:2px;background:linear-gradient(90deg,transparent,var(--amber2),transparent);margin:22px auto;max-width:420px;position:relative}
.courtline:after{content:'';position:absolute;left:50%;top:-11px;width:22px;height:22px;border:2px solid var(--amber2);border-radius:50%;transform:translateX(-50%);background:var(--bg)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slot .info{flex:1;min-width:180px}
input[type=text]{background:var(--inset);border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:9px 12px;font-family:'Instrument Sans';font-size:15px;width:100%;max-width:340px}
input[type=text]:focus{outline:2px solid var(--amber2);outline-offset:1px}
select{background:var(--inset);border:1px solid var(--line2);color:var(--ink);border-radius:4px;padding:7px 10px;font-family:'Instrument Sans';font-size:14px}
.skill-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #271E11;flex-wrap:wrap}
.skill-nm{width:120px;font-weight:600}
.skill-desc{flex:1;min-width:160px}
.dots{display:flex;gap:3px}
.dot{width:11px;height:11px;border-radius:2px;background:#2A2013;border:1px solid #3A2D1B}
.dot.f{background:var(--amber);box-shadow:0 0 6px rgba(255,176,46,.5)}
.jobcard{border:1px solid var(--line);border-radius:6px;padding:13px;background:var(--panel2);cursor:pointer;margin-top:10px;transition:border-color .12s}
.jobcard:hover{border-color:var(--amber2)}
.jobcard.sel{border-color:var(--amber);background:rgba(255,176,46,.05)}
.effbtn{width:26px;height:26px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-weight:700;cursor:pointer;font-size:14px}
.effbtn:hover{border-color:var(--amber2)}
.effbtn:disabled{opacity:.3;cursor:default}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--muted);cursor:pointer;margin:3px 4px 0 0}
.chip.on{border-color:var(--amber);color:var(--amber)}
.fade{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
@media(max-width:640px){
  .brand{font-size:18px}
  .led{font-size:14px}
  .sb-cell{min-width:52px;padding:4px 7px 5px}
  .sb{gap:8px}
}
@media(max-width:420px){
  .tbl{font-size:12.5px}
  .tbl th,.tbl td{padding:5px 5px}
  .tblwrap{margin:0 -4px;padding:0 4px;border-radius:6px}
  .tblwrap.scrollcue:after{content:"→";position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--amber);font-size:13px;opacity:.85;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.6)}
  .grid3{display:block}
  .grid3>div{margin-bottom:10px}
  .grid2{display:block}
  .grid2>div{margin-bottom:10px}
  .card{padding:12px}
  .rowline{flex-wrap:wrap;gap:2px 8px}
  .favrow{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===========================================================
   The Victors' Desk — account-backed saves.

   The game reads window.storage if present, so this replaces its
   storage layer without touching game logic. Same-origin fetch means
   the Supabase session cookie travels with the request and saves land
   against the signed-in account. A 401 raises the sign-in prompt.
=========================================================== */
(function () {
  var GAME = 'hardwood-dynasty';
  var api = '/api/games/saves';

  window.storage = {
    get: function (key) {
      return fetch(api + '?game=' + GAME + '&key=' + encodeURIComponent(key), {
        credentials: 'same-origin',
      }).then(function (r) {
        if (r.status === 401) { window.__vdNeedsAuth(); throw new Error('auth'); }
        if (!r.ok) throw new Error('failed');
        return r.json();
      }).then(function (j) {
        if (j.value == null) throw new Error('empty');
        return { value: j.value };
      });
    },
    set: function (key, value) {
      return fetch(api, {
        method: 'PUT',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: GAME, key: key, value: value }),
      }).then(function (r) {
        if (r.status === 401) { window.__vdNeedsAuth(); throw new Error('auth'); }
        if (!r.ok) throw new Error('failed');
        return true;
      });
    },
    delete: function (key) {
      return fetch(api + '?game=' + GAME + '&key=' + encodeURIComponent(key), {
        method: 'DELETE',
        credentials: 'same-origin',
      }).then(function (r) { return r.ok; });
    },
  };

  var barShown = false;
  window.__vdNeedsAuth = function () {
    if (barShown) return;
    barShown = true;
    var bar = document.createElement('div');
    bar.style.cssText =
      'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#00274D;color:#fff;' +
      'padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;' +
      'font-family:system-ui,sans-serif;font-size:14px;box-shadow:0 -6px 24px rgba(0,0,0,.35)';
    bar.innerHTML =
      '<span>Sign in to save your dynasty — progress is kept to your account.</span>' +
      '<a href="/login?next=/games/hardwood-dynasty" style="background:#FFCB05;color:#00274D;' +
      'font-weight:700;padding:7px 14px;border-radius:9px;text-decoration:none">Sign in</a>' +
      '<button style="background:none;border:0;color:#9fb3c8;cursor:pointer;font-size:18px">&times;</button>';

let QUIET_REC=false;
function upsertRec(list,entry,cap){
  cap=cap||15;
  const prevTop=list[0]||null;
  const i=list.findIndex(e=>e.name===entry.name&&e.school===entry.school);
  if(i>=0){if(list[i].v>=entry.v)return false;list.splice(i,1);}
  list.push(entry);list.sort((a,b)=>b.v-a.v);
  if(list.length>cap)list.length=cap;
  const ix=list.indexOf(entry);
  const kept=ix>=0;
  if(kept&&entry.u&&!QUIET_REC&&G&&G.feed){
    if(ix===0){
      if(prevTop&&prevTop.name===entry.name&&prevTop.school===entry.school){
        addNews("RECORD BOOK: "+entry.name+" extends his own all-time record to "+entry.v+".","hof");
        pushHeadline("RECORDS",entry.name+" extends the all-time record to "+entry.v);
        post(G.teams[G.coach.teamId],entry.name+" just padded HIS OWN all-time record. "+entry.v+" now. Ridiculous.",4);
      }else if(prevTop){
        addNews("RECORD BOOK: "+entry.name+" passes "+prevTop.name+" ("+prevTop.v+") for the all-time record at "+entry.v+"!","hof");
        pushHeadline("RECORDS",entry.name+" passes "+prevTop.name+" for the all-time record");
        post(G.teams[G.coach.teamId],entry.name+" JUST PASSED "+prevTop.name.toUpperCase()+" FOR THE ALL-TIME RECORD. "+entry.v+" and counting. HISTORY.",5);
      }else{
        pushHeadline("RECORDS",entry.name+" sets a brand-new all-time record at "+entry.v);
        post(G.teams[G.coach.teamId],entry.name+" just set a BRAND NEW all-time record. "+entry.v+".",5);
      }
    }else if(ix>=1&&ix<3){
      const ahead=list[ix-1];
      pushHeadline("RECORDS",entry.name+" climbs to No. "+(ix+1)+" on an all-time list");
      if(rnd()<0.55)post(G.teams[G.coach.teamId],entry.name+" moves to No. "+(ix+1)+" all-time ("+entry.v+"), trailing only "+ahead.name+".",3);
    }
  }
  return kept;
}

function assignFanBases(teams){
  const rest=teams.filter(t=>FAN_TOP25[t.abbr]==null);
  const sorted=[...rest].sort((a,b)=>fanBlueScore(a)-fanBlueScore(b));
  const FLOOR=6000,CEIL=1350000;
  sorted.forEach((t,idx)=>{
    const pct=sorted.length>1?idx/(sorted.length-1):0;
    t.fanBase=Math.round(FLOOR*Math.pow(CEIL/FLOOR,pct)*(0.9+rnd()*0.2));
  });
  for(const t of teams)if(FAN_TOP25[t.abbr]!=null)t.fanBase=FAN_TOP25[t.abbr];
}

/* =====================================================
   SCHEDULE — circle-method round robin + non-conference
===================================================== */
function roundRobin(ids){
  const t=[...ids];if(t.length%2)t.push(-1);
  const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!==-1&&b!==-1)rd.push(r%2?[b,a]:[a,b]);}
    rounds.push(rd);t.splice(1,0,t.pop());
  }
  return rounds;
}
function nonConfRound(){
  const ids=shuffle(G.teams.map(t=>t.id));const gs=[];
  for(let i=0;i+1<ids.length;i+=2)gs.push({h:ids[i],a:ids[i+1],c:false,hs:null,as:null});
  return gs;
}
function buildSeasonSchedule(){
  const weeks=[];
  for(let w=0;w<4;w++)weeks.push([...nonConfRound(),...nonConfRound()]);
  const confRounds={};
  for(const c of CONFS)confRounds[c]=roundRobin(G.teams.filter(t=>t.conf===c).map(t=>t.id));
  for(let w=0;w<11;w++){
    const wk=[];
    for(const c of CONFS){
      const rds=confRounds[c],L=rds.length;
      for(let k=0;k<2;k++){
        const idx=(w*2+k)%L,flip=Math.floor((w*2+k)/L)%2===1;
        for(const[a,b]of rds[idx])wk.push(flip?{h:b,a:a,c:true,hs:null,as:null}:{h:a,a:b,c:true,hs:null,as:null});
      }
    }
    weeks.push(wk);
  }
  return{weeks};
}

function simGame(h,a,neutral){
  const d=effOvr(h)-effOvr(a)+(neutral?0:1.6);
  const sh=styleOf(h),sa=styleOf(a);
  let sig=8.6;if(sh.scheme==="Three-Point Barrage")sig+=1.2;if(sa.scheme==="Three-Point Barrage")sig+=1.2;
  let m=gauss(d*0.78,sig);let ot=false;
  if(Math.abs(m)<1.2){ot=true;m=(m<0?-1:1)*ri(1,4);}
  let base=144;for(const s of[sh,sa]){if(s.tempo==="Fast")base+=6;if(s.tempo==="Slow")base-=6;if(s.scheme==="Defense First")base-=4;}
  const total=clamp(Math.round(gauss(base+(ot?9:0),12)),108,192);
  let hs=Math.round((total+m)/2),as=total-hs;
  if(hs===as)hs++;
  hs=clamp(hs,44,112);as=clamp(as,44,112);
  return{hs,as,ot};
}
function statLine(team,teamPts){

function checkBigRecords(weekGames){

    const Wt=G.teams[g.hs>g.as?g.h:g.a];
    if(Wt.streak>0&&Wt.streak>Wt.bestStreak){
      Wt.bestStreak=Wt.streak;

function fanTarget(t){
  const anchor=t.fanBase||6000;
  const gp=(t.w+t.l)||1, wp=t.w/gp;
  const expw=0.32+t.prestige/240;
  let mult=1+(wp-expw)*0.55;
  if(t.result==="National Champion")mult+=0.22;
  else if(t.result==="Runner-up")mult+=0.13;
  else if(t.result==="Final Four")mult+=0.09;
  else if(t.result==="Elite Eight")mult+=0.05;
  else if(t.seed!=null)mult+=0.025;
  if(t.banners.conf.includes(G.seasonYear))mult+=0.02;
  if(wp<0.28)mult-=0.07;
  mult*=0.97+rnd()*0.06;
  mult=clamp(mult,0.8,1.28);
  return Math.round(anchor*mult);
}
function fanbaseUpdate(t){
  const anchor=t.fanBase||6000;

  const minF=Math.round(anchor*0.55), maxF=Math.round(anchor*1.35);
  t.fans=Math.round(clamp(prev+(tgt-prev)*0.35,minF,maxF));
  t.fansTrend=t.fans-prev;
}

function weeklyRecruiting(){
  const yt=G.teams[G.coach.teamId];
  const basePitch=0.55+yt.prestige/155+G.coach.skills.cha*0.05;
  const wpct=(yt.w+yt.l)?yt.w/(yt.w+yt.l):0.5;
  const repFac=0.7+G.coach.rep/130;
  const sco=G.coach.skills.sco;
  if(G.recruitBoost>0)G.recruitBoost--;
  for(const r of G.recruits){
    if(r.signed!=null)continue;
    for(const s of r.suitors)s.pts+=(G.teams[s.tid].prestige/10)*(0.30+rnd()*0.50);
    if(!G.board.includes(r.id))continue;
    const lvl=r.level||0;
    let visitBoost=0;
    if(r.visitWk===G.week){
      r.visitWk=null;r.visited=true;r.sc1=true;r.sc2=true;
      const q=rnd()+G.coach.skills.cha*0.045+((G._ww||0)>0?0.08:0);
      visitBoost=q>0.9?34+ri(0,10):q>0.5?22:10;
      if(q>0.9){pushHeadline("RECRUITING",r.name+"'s official visit to "+yt.name+" goes perfectly");post(yt,"Sources: "+r.name+"'s visit was a HOME RUN. Book it.",3,{h:"@"+yt.abbr+"Insider",ins:true});}
      else addNews(r.name+" ("+r.stars+"★ "+r.pos+") wraps an official visit to campus.","recruit");
    }
    if(lvl>0){
      r.contactWks=(r.contactWks||0)+1;
      if(!r.sc1&&r.contactWks>=Math.max(1,4-Math.floor(sco/4)))r.sc1=true;
      if(!r.sc2&&r.contactWks>=Math.max(2,7-Math.floor(sco/3))){r.sc2=true;
        if(r.gem===1)addNews("Scouting report: staff believes "+r.name+" ("+r.stars+"★) is badly underrated.","recruit");
        if(r.gem===-1)addNews("Scouting report: staff has doubts about "+r.name+"'s tape.","recruit");}
    }
    if(lvl>0||visitBoost>0){
      const min={5:82,4:72,3:58,2:0}[r.stars]||0;
      const pen=clamp(1-Math.max(0,min-yt.prestige)*0.035,0.25,1);
      let mult=1;
      if(r.want==="Playing Time"){const comp=yt.roster.filter(p=>p.pos===r.pos&&p.ovr>=r.ovr-3).length;mult*=comp<=1?1.3:0.8;}
      if(r.want==="Winning")mult*=0.6+wpct*0.8+(yt.rank?0.15:0);
      if(r.want==="Development")mult*=0.72+G.coach.skills.dev*0.08+asstLvl("Development")*0.05;
      if(r.want==="Loyalty")mult*=(r.contactWks>=6?1.3:0.85);
      if(r.want==="Spotlight")mult*=0.55+yt.prestige/85+(G.coach.career.ncaa>0?0.1:0);
      if(G.recruitBoost>0)mult*=1.25;
      const gain=(lvl===2?8:lvl===1?3.2:0)*basePitch*pen*mult*repFac*(0.85+rnd()*0.3);
      r.intU+=gain+visitBoost*basePitch*pen*mult;
    }
  }
}

function buildNcaaField(){
  const autos=Object.values(G.confT.champs);
  const rest=[...G.teams].filter(t=>!autos.includes(t.id)).sort((a,b)=>b.rating-a.rating);
  const atLarge=rest.slice(0,64-autos.length).map(t=>t.id);
  const field=[...autos,...atLarge].map(id=>G.teams[id]).sort((a,b)=>b.rating-a.rating);
  const regions=["East","West","South","Midwest"];
  const slots=[];
  field.forEach((t,i)=>{const seed=Math.floor(i/4)+1;const grp=Math.floor(i/4)%2?[3,2,1,0]:[0,1,2,3];
    t.seed=seed;slots.push({tid:t.id,seed,region:regions[grp[i%4]]});});
  const order=[1,16,8,9,5,12,4,13,6,11,3,14,7,10,2,15];
  const brackets={};
  for(const rg of regions){
    const rs=slots.filter(s=>s.region===rg);
    brackets[rg]=order.map(sd=>rs.find(s=>s.seed===sd));
  }
  const nitPool=rest.slice(64-autos.length,64-autos.length+32);
  const nitIds=nitPool.map(t=>t.id);
  G.nit={teams:nitIds,rounds:[],alive:bracketOrder(32).map(s=>nitIds[s-1]),champ:null};
  G.ncaa={regions,brackets,rounds:[],roundIdx:0,champ:null,runnerUp:null,finalScore:"",mop:null,stage:"selection",
    userIn:field.some(t=>t.id===G.coach.teamId)};
  for(const t of field){t.result="NCAA field";if(t.id===G.coach.teamId){G.coach.career.ncaa++;}}
  const you=G.teams[G.coach.teamId];
  addNews(G.ncaa.userIn?("Selection Sunday: "+you.name+" is dancing as a "+you.seed+" seed!"):("Selection Sunday: "+you.name+" misses the NCAA field."),"ncaa");
  if(G.nit.teams.includes(G.coach.teamId))addNews(you.name+" accepts an NIT invitation.","ncaa");
}

    else if(rnd()<0.5)natPost(pick(NIT_NAT)({t:c}),2);
  }
}

function awardScore(p,t){return p.s.pts+p.s.reb*1.15+p.s.ast*1.4+t.w*2.5;}
function computeAwards(){
  const all=[];
  for(const t of G.teams)for(const p of t.roster)if(p.s.g>0)all.push({p,t,sc:awardScore(p,t)});
  all.sort((a,b)=>b.sc-a.sc);
  const poy=all[0];
  const aa1=all.slice(0,5),aa2=all.slice(5,10);
  const fr=all.filter(x=>x.p.yr===0)[0];
  const dsc=x=>x.p.s.stl*3+x.p.s.blk*3+x.p.s.reb*0.8+(x.p.at?x.p.at.def:60)*2+x.t.w*1.5;
  const dp=[...all].sort((a,b)=>dsc(b)-dsc(a))[0];
  let coy=null,best=-99;
  for(const t of G.teams){const over=(t.w/(t.w+t.l||1))-(0.3+t.prestige/240);if(over>best){best=over;coy={t};}}
  poy.p.awards.push({y:G.seasonYear,a:"National Player of the Year"});
  aa1.forEach(x=>x.p.awards.push({y:G.seasonYear,a:"First Team All-American"}));
  aa2.forEach(x=>x.p.awards.push({y:G.seasonYear,a:"Second Team All-American"}));
  if(fr)fr.p.awards.push({y:G.seasonYear,a:"Freshman of the Year"});
  if(dp)dp.p.awards.push({y:G.seasonYear,a:"Defensive Player of the Year"});
  const confAw={};
  for(const c of CONFS){
    const ca=all.filter(x=>x.t.conf===c);
    if(!ca.length)continue;
    ca[0].p.awards.push({y:G.seasonYear,a:"Conference Player of the Year"});
    ca.slice(0,5).forEach(x=>x.p.awards.push({y:G.seasonYear,a:"All-Conference First Team"}));
    confAw[c]={poy:ca[0].p.name+" ("+ca[0].t.abbr+")",team:ca.slice(0,5).map(x=>x.p.name+" ("+x.t.abbr+")")};
  }
  G.awards={poy:{name:poy.p.name,team:poy.t.name,line:f1(poy.p.s.pts/poy.p.s.g)+" ppg, "+f1(poy.p.s.reb/poy.p.s.g)+" rpg, "+f1(poy.p.s.ast/poy.p.s.g)+" apg"},
    aa1:aa1.map(x=>({name:x.p.name,team:x.t.abbr})),aa2:aa2.map(x=>({name:x.p.name,team:x.t.abbr})),
    froy:fr?{name:fr.p.name,team:fr.t.name}:null,dpoy:dp?{name:dp.p.name,team:dp.t.name}:null,
    coy:coy?{name:coy.t.coach.name,team:coy.t.name}:null,conf:confAw};
  if(poy.t.id===G.coach.teamId)giveTrophy("poyT");
  addNews(poy.p.name+" ("+poy.t.name+") is named National Player of the Year.","award");
  if(dp)addNews(dp.p.name+" ("+dp.t.name+") wins Defensive Player of the Year.","award");
  const uc=you().conf;
  if(confAw[uc])addNews(confAw[uc].poy+" is "+uc+" Player of the Year.","award");
  for(const x of aa1.concat(aa2))if(x.t.id===G.coach.teamId)addNews(x.p.name+" earns All-America honors!","award");
  if(coy)addNews(coy.t.coach.name+" of "+coy.t.name+" wins Coach of the Year.","award");
  if(coy&&coy.t.id===G.coach.teamId)G.coach.rep+=4;
}
function expectationFor(p){
  if(p>=90)return{txt:"Reach the Final Four",goal:7};
  if(p>=82)return{txt:"Make the Sweet 16",goal:5};
  if(p>=74)return{txt:"Make the NCAA Tournament",goal:3};
  if(p>=65)return{txt:"Post a winning season",goal:1};
  return{txt:"Show progress (win 40% of games)",goal:0};
}
function resultRank(t){
  switch(t.result){
    case"National Champion":return 9;case"Runner-up":return 8;case"Final Four":return 7;
    case"Elite Eight":return 6;case"Sweet 16":return 5;case"Round of 32":return 4;
    case"Round of 64":case"NCAA field":return 3;case"NIT Champion":return 2;case"NIT":return 1;default:return 0;
  }
}
function seasonReview(){
  const you=G.teams[G.coach.teamId],C=G.coach;
  const exp=expectationFor(you.prestige);
  const rr=resultRank(you);
  const wpct=you.w/(you.w+you.l||1);
  let grade;
  if(exp.goal<=1){grade=(exp.goal===0?(wpct>=0.40):(wpct>=0.5||rr>=1))?(rr>=3||wpct>=0.62?"exceed":"meet"):"miss";}
  else grade=rr>exp.goal?"exceed":rr===exp.goal?"meet":(rr>=exp.goal-1&&rr>=3?"meet":"miss");
  let dP=0;
  if(grade==="exceed"){dP=ri(2,3)+(rr===9?2:0);C.hotSeat=clamp(C.hotSeat-45,0,100);}
  else if(grade==="meet"){dP=ri(0,1);C.hotSeat=clamp(C.hotSeat-22,0,100);}
  else{dP=-ri(2,3);C.hotSeat=clamp(C.hotSeat+ri(34,42),0,100);}
  you.prestige=clamp(you.prestige+dP,30,99);
  C.rep=clamp(C.rep+you.w*0.22-you.l*0.10,20,99);
  C.rep=clamp(C.rep+(rr>=9?12:rr>=7?8:rr>=5?5:rr>=3?3:0)+(G.confT&&G.confT.champs[you.conf]===you.id?2:0)+(grade==="exceed"?2:grade==="miss"?-2:0),20,99);
  let sp=3+(rr>=3?1:0)+(rr>=5?1:0)+(rr>=7?1:0)+(rr===9?3:0)+(G.confT&&G.confT.champs[you.conf]===you.id?1:0);
  C.sp+=sp;
  C.career.seasons++;C.career.w+=you.w;C.career.l+=you.l;
  C.career.log.push({y:G.seasonYear,team:you.name,w:you.w,l:you.l,result:you.result,grade,prest:you.prestige});
  {const tc=you.coach;tc.w=C.career.w;tc.l=C.career.l;tc.seasons=C.career.seasons;tc.chips=C.career.chips;tc.f4=C.career.f4;tc.confT=C.career.confT;tc.confRS=C.career.confRS||0;tc.tw=C.career.tw||0;tc.drafted=C.career.drafted||0;tc.age=C.age;}
  if(rr>=3)giveTrophy("firstTourney");
  if(C.career.tw>0)giveTrophy("firstWin");
  if(rr>=5)giveTrophy("s16");
  if(rr>=7)giveTrophy("f4Run");
  if(rr>=9){giveTrophy("natty");if(you.prestige<75)giveTrophy("cinderella");}
  if(you.w>=30)giveTrophy("thirty");
  if(you.seed===1)giveTrophy("oneSeed");
  if(C.career.w>=500)giveTrophy("w500");
  if(you.prestige>=80&&G.stintStart<60)giveTrophy("rebuild");
  tmMorale(grade==="exceed"?4:grade==="miss"?-4:1);
  if(G.records&&G.records.coachW){
    for(const t2 of G.teams){const c2=t2.coach;
      if(c2.w>=782)upsertRec(G.records.coachW,{name:c2.name,school:t2.name,v:c2.w,y:G.seasonYear,u:!!c2.user});
      if(c2.chips>=2)upsertRec(G.records.coachTitles,{name:c2.name,school:t2.name,v:c2.chips,y:G.seasonYear,u:!!c2.user},12);
    }
  }
  C.contractYear++;
  let firedNow=false;
  if(C.hotSeat>=100)firedNow=true;
  if(C.contractYear>C.contractLen){
    if(C.hotSeat<67){C.contractYear=1;addNews(you.name+" extends your contract for 4 more seasons.","job");}
    else firedNow=true;
  }
  if(firedNow){C.fired=true;pushHeadline("COACHING",you.name+" fires "+C.name+" after a "+you.w+"–"+you.l+" season");fanCoach("fired");addNews(you.name+" has relieved you of your duties. The search for your next job begins.","fired");}
  G.review={grade,exp:exp.txt,dP,sp,fired:firedNow,result:you.result,rec:you.w+"–"+you.l};
  saveGame();
}

const AWARD_PTS={"National Player of the Year":600,"First Team All-American":250,"Second Team All-American":120,"Tournament MOP":250,"Freshman of the Year":100,"Defensive Player of the Year":150,"Conference Player of the Year":60,"All-Conference First Team":30,"National Champion":100};
function playerHofPts(p){
  const prod=Math.round((p.career.pts+p.s.pts)*0.35+(p.career.reb+p.s.reb)*0.25+(p.career.ast+p.s.ast)*0.4);
  let aw=0;for(const a of p.awards)aw+=AWARD_PTS[a.a]||0;
  let dr=0;if(p.draftPick)dr=p.draftPick<=14?120:p.draftPick<=30?70:35;
  return{prod,aw,dr,total:prod+aw+dr};
}
function closeSeasonStats(p,teamName){
  if(p.s.g>0){
    p.career.g+=p.s.g;p.career.pts+=p.s.pts;p.career.reb+=p.s.reb;p.career.ast+=p.s.ast;
    p.career.seasons.push({y:yearLbl(G.seasonYear),team:teamName,g:p.s.g,ppg:f1(p.s.pts/p.s.g),rpg:f1(p.s.reb/p.s.g),apg:f1(p.s.ast/p.s.g)});
    if(G.records&&G.records.pts&&p.s.pts>=520)upsertRec(G.records.pts.season,{name:p.name,school:teamName,v:p.s.pts,y:G.seasonYear,u:teamName===G.teams[G.coach.teamId].name});
  }
  p.s={g:0,pts:0,reb:0,ast:0,stl:0,blk:0};
}
function maybeHofPlayer(p,t){
  const pts=playerHofPts(p);
  if(pts.total>=PLAYER_HOF){
    G.hof.players.push({name:p.name,pos:p.pos,school:t.name,y:G.seasonYear,g:p.career.g,ppg:p.career.g?f1(p.career.pts/p.career.g):"0.0",rpg:p.career.g?f1(p.career.reb/p.career.g):"0.0",apg:p.career.g?f1(p.career.ast/p.career.g):"0.0",awards:p.awards.map(a=>a.a),pts:pts.total});
    addNews(p.name+" ("+t.name+") is enshrined in the College Hall of Fame with "+pts.total+" legacy points.","hof");
  }
}
function coachHofPts(c){
  const b={wins:Math.round((c.w||0)*0.5),natty:(c.chips||0)*300,f4:(c.f4||0)*100,ncaaWins:(c.tw||0)*15,confT:(c.confT||0)*40,confRS:(c.confRS||0)*25,drafted:(c.drafted||0)*20};
  b.total=b.wins+b.natty+b.f4+b.ncaaWins+b.confT+b.confRS+b.drafted;
  return b;
}
function coachHofEligible(c){return coachHofPts(c).total>=COACH_HOF;}
function runOffStage(){
  const you=G.teams[G.coach.teamId];
  const st=G.offStage;
  if(st===0){ // retention window: personal appeals to flight risks
    G.retention=[];
    G.appealsLeft=1+Math.floor(G.coach.skills.cha/3);
    const avg=you.roster.length?you.roster.reduce((s,p)=>s+p.ovr,0)/you.roster.length:70;
    for(const p of you.roster){
      if(p.yr>=3)continue;
      const draftRisk=p.ovr>=85||(p.pot>=93&&p.ovr>=81);
      const portalRisk=p.leaving||((p.morale||70)<45)||(p.ovr<avg-8);
      if(draftRisk)G.retention.push({pid:p.id,name:p.name,pos:p.pos,ovr:p.ovr,kind:"NBA Draft",done:false,failed:false});
      else if(portalRisk)G.retention.push({pid:p.id,name:p.name,pos:p.pos,ovr:p.ovr,kind:"Transfer Portal",done:false,failed:false});
    }
  }
  if(st===1){ // departures + draft
    G.offMsgs=[];const draftPool=[];const leavers=[];
    for(const t of G.teams){
      const stay=[];
      for(const p of t.roster){
        closeSeasonStats(p,t.name);
        const isU=t.id===you.id;
        if(isU&&p.leaving&&!p.retained&&p.yr<3){
          G.offMsgs.push({s:0,txt:p.name+" enters the transfer portal, as promised."});
          continue;
        }
        const declares=p.yr<3&&!p.retained&&(p.ovr>=85||(p.pot>=93&&p.ovr>=81&&rnd()<0.6));
        if(p.yr>=3||declares){
          if(p.ovr>=70)draftPool.push({p,t});
          leavers.push({p,t});
          if(G.records&&G.records.pts){
            if(p.career.pts>=1100)upsertRec(G.records.pts.career,{name:p.name,school:t.name,v:p.career.pts,y:G.seasonYear,u:t.id===you.id});
            if(p.career.reb>=750)upsertRec(G.records.reb.career,{name:p.name,school:t.name,v:p.career.reb,y:G.seasonYear,u:t.id===you.id});
            if(p.career.ast>=420)upsertRec(G.records.ast.career,{name:p.name,school:t.name,v:p.career.ast,y:G.seasonYear,u:t.id===you.id});
          }
          if(isU)G.offMsgs.push({s:0,txt:p.name+(p.yr>=3?" graduates":" declares for the NBA Draft")+" ("+p.ovr+" OVR)."});
        }else{p.yr++;p.ret=true;p.leaving=false;stay.push(p);}
      }
      t.roster=stay;
    }
    // transfers out (user team)
    const avg=you.roster.length?you.roster.reduce((s,p)=>s+p.ovr,0)/you.roster.length:70;
    let xfers=0;
    for(const p of [...you.roster]){
      if(xfers>=2)break;
      if(p.retained)continue;
      const risk=(p.ovr<avg-8||((p.morale||70)<45));
      if(risk&&rnd()<Math.max(0.03,0.18-G.coach.skills.cha*0.015)){
        you.roster=you.roster.filter(x=>x!==p);xfers++;
        G.offMsgs.push({s:0,txt:p.name+" enters the transfer portal seeking more minutes."});
      }
    }
    for(const e of (G.retention||[]))if(e.done){const p=you.roster.find(x=>x.id===e.pid);if(p)G.offMsgs.push({s:0,txt:p.name+" withdraws from "+e.kind+" consideration — retention deal honored."});}
    // draft
    draftPool.sort((a,b)=>(b.p.ovr+b.p.pot*0.35+rnd()*6)-(a.p.ovr+a.p.pot*0.35+rnd()*6));
    const drafted=draftPool.slice(0,60);
    drafted.forEach((x,i)=>{x.p.draftPick=i+1;});
    const picks=drafted.map((x,i)=>({pick:i+1,name:x.p.name,school:x.t.name,abbr:x.t.abbr,pos:x.p.pos,user:x.t.id===you.id,tid:x.t.id}));
    G.history.draft.unshift({y:G.seasonYear,picks});
    for(const pk of picks){
      G.teams[pk.tid].coach.drafted=(G.teams[pk.tid].coach.drafted||0)+1;
      if(pk.user){G.coach.career.drafted++;addNews(pk.name+" is selected "+ord(pk.pick)+" overall in the NBA Draft!","draft");G.coach.rep=clamp(G.coach.rep+(pk.pick<=14?2:1),20,99);
        pushHeadline("DRAFT",pk.name+" selected "+ord(pk.pick)+" overall in the NBA Draft");fanDraft(pk);}
      else if(pk.pick<=5)addNews(pk.name+" ("+pk.school+") goes "+ord(pk.pick)+" overall in the NBA Draft.","draft");
    }
    G.draftJustNow=picks;
    draftNational(picks);
    for(const lv of leavers)maybeHofPlayer(lv.p,lv.t);
  }
  if(st===2){ // coaching carousel + assistant poaching
    const vac=[];
    for(const t of G.teams){
      if(t.id===you.id)continue;
      const c=t.coach;c.age++;c.seasons++;c.tenure++;
      const wp=t.w/(t.w+t.l||1),expw=0.32+t.prestige/240;
      if(wp>expw+0.1)t.prestige=clamp(t.prestige+ri(1,2),30,99);
      else if(wp<expw-0.1)t.prestige=clamp(t.prestige-ri(1,2),30,99);
      let out=null;
      if(c.age>=70||(c.age>=65&&rnd()<0.4))out="retires";
      else if(wp<expw-0.13&&c.tenure>=2&&rnd()<0.6)out="is fired";
      if(out){
        if(G.records&&G.records.coachW){
          if(c.w>=400)upsertRec(G.records.coachW,{name:c.name,school:t.name,v:c.w,y:G.seasonYear});
          if(c.chips>=2)upsertRec(G.records.coachTitles,{name:c.name,school:t.name,v:c.chips,y:G.seasonYear},12);
        }
        if(coachHofEligible(c)){G.hof.coaches.push({name:c.name,school:t.name,w:c.w,l:c.l,chips:c.chips,f4:c.f4,y:G.seasonYear,pts:coachHofPts(c).total});
          addNews(c.name+" ("+t.name+") "+out+" and enters the Coaching Hall of Fame with "+coachHofPts(c).total+" legacy points.","hof");}
        else if(out==="retires"&&c.w>=350)addNews(c.name+" retires after "+c.seasons+" seasons and "+c.w+" wins at multiple stops.","coach");
        else addNews(t.name+" "+(out==="is fired"?"fires "+c.name+" after a "+t.w+"–"+t.l+" season.":"loses "+c.name+" to retirement."),"coach");
        vac.push(t);
      }
    }
    carouselNational(vac);
    let poached=false;
    for(const t of vac){
      const cand=(G.staff||[]).filter(a=>a&&a.lvl>=3);
      if(!poached&&cand.length&&rnd()<0.4){
        const a=cand.sort((x,y)=>y.lvl-x.lvl)[0];
        t.coach={name:a.name,age:ri(36,46),skill:2+a.lvl,seasons:0,w:0,l:0,chips:0,f4:0,confT:0,confRS:0,tw:0,drafted:0,tenure:0};
        t.style={tempo:pick(TEMPOS),scheme:pick(SCHEMES)};
        t.openJob=false;
        G.tree.push({name:a.name,school:t.name,y:G.seasonYear});
        giveTrophy("treeT");
        G.staff[G.staff.indexOf(a)]=null;
        addNews("Your assistant "+a.name+" is hired as the head coach at "+t.name+"!","coach");
        poached=true;
      }else{
        t.openJob=true;
        t.coach=newCoachAI(t.prestige,false);t.coach.tenure=0;
        t.style={tempo:pick(TEMPOS),scheme:pick(SCHEMES)};
      }
    }
    for(const a of G.staff)if(a)a.yrs++;
    G.staffMarket=[newAsst(you.prestige+G.coach.rep-20),newAsst(you.prestige),newAsst(you.prestige-10),newAsst(you.prestige-20)];
  }
  if(st===3){ // recruiting signings
    G.signed=[];G.lost=[];
    const spots=()=>ROSTER_MAX-you.roster.length;
    const sorted=[...G.recruits].sort((a,b)=>a.rk-b.rk);
    for(const r of sorted){
      const cands=r.suitors.map(s=>({tid:s.tid,pts:Math.max(1,s.pts)}));
      if(G.board.includes(r.id)&&r.intU>0)cands.push({tid:you.id,pts:Math.max(1,r.intU*1.12)});
      if(!cands.length){r.signed=-1;continue;}
      const tot=cands.reduce((s,c)=>s+Math.pow(c.pts,1.5),0);
      let roll=rnd()*tot,winner=cands[0].tid;
      for(const c of cands){roll-=Math.pow(c.pts,1.5);if(roll<=0){winner=c.tid;break;}}
      if(winner===you.id){
        if(spots()<=0){r.signed=-1;G.lost.push({r,why:"no scholarship available"});continue;}
        r.signed=you.id;
            const p=newPlayer(60,0,{pos:r.pos});
        Object.assign(p,{name:r.name,pos:r.pos,ht:r.ht,ovr:r.ovr,prevOvr:r.ovr,pot:r.pot,stars:r.stars,rkN:r.rk,gem:r.gem,hometown:r.hometown,at:r.at,arch:r.arch,yr:0,ret:false});
        p.gen=r.gen;you.roster.push(p);
        G.signed.push(r);
        if(r.stars===5)giveTrophy("fiveStar");
        if(r.gen)giveTrophy("genT");
        addNews((r.gen?"GENERATIONAL RECRUIT ":"")+r.name+" ("+r.stars+"★ "+r.pos+") signs with "+you.name+"!","recruit");
        if(r.stars>=4||r.gen)pushHeadline("SIGNED",(r.gen?"Generational prospect ":"")+r.name+" ("+r.stars+"★ "+r.pos+") commits to "+you.name);
        fanCommit(r);
        G.coach.rep=clamp(G.coach.rep+(r.stars>=5?2:r.stars===4?1:0.5),20,99);
      }else{
        r.signed=winner;
        if(G.board.includes(r.id)){G.lost.push({r,why:"chose "+G.teams[winner].name});
          if(winner===you.rival&&r.stars>=3){
            post(you,pick([
              "We lost "+r.name+" to THEM. To "+G.teams[winner].abbr+". I need a minute.",
              "Losing a recruit to our rival is its own special kind of pain. "+r.name+", gone.",
              r.name+" picked "+G.teams[winner].abbr+" over us. Recruiting rivalry: lost.",
              "Watching "+r.name+" commit to "+G.teams[winner].abbr+" live was not a good time."
            ]),4);
          }else if(r.stars>=4)post(you,"We lost "+r.name+" ("+r.stars+"★) to "+G.teams[winner].abbr+". Recruiting Ls hit different.",3);
        }
        if(r.stars===5)addNews(r.name+", a 5★ "+r.pos+", commits to "+G.teams[winner].name+".","recruit");
      }
    }
    // AI roster refill + light AI development
    for(const t of G.teams){
      if(t.id===you.id)continue;
      for(const p of t.roster){p.ovr=clamp(p.ovr+ri(0,3),50,Math.max(p.ovr,p.pot));if(p.at)for(const k in p.at)p.at[k]=clamp(p.at[k]+ri(0,2),40,99);}
      while(t.roster.length<11)t.roster.push(newPlayer(t.prestige,0));
      t.roster.sort((a,b)=>b.ovr-a.ovr);
    }
  }
  if(st===3)classNational();
  if(st===4){ // development (user returning players) + walk-ons
    G.devLog=[];
    for(const p of you.roster){
      if(!p.ret)continue;
      const gap=Math.max(0,p.pot-p.ovr);
      let inc=Math.max(0,gauss(1.1+G.coach.skills.dev*0.55+asstLvl("Development")*0.2+gap*0.17+(G.rotation==="Deep Bench"?0.25:0),1.4));
      if(p.gem===1)inc*=1.25;if(p.gem===-1)inc*=0.5;
      const mm=(p.morale||70);inc*=mm>=75?1.1:mm<50?0.85:1;
      inc=Math.round(inc);
      const was=p.ovr;p.ovr=clamp(p.ovr+inc,50,p.pot);p.prevOvr=was;
      p.pot=clamp(p.pot+ri(-1,1),p.ovr,99);p.ret=false;
      if(p.at){for(const k in p.at)p.at[k]=clamp(p.at[k]+inc+ri(-1,1),40,99);const tk=TRAIN_KEY[G.training];if(tk)p.at[tk]=clamp(p.at[tk]+1,40,99);p.arch=archetype(p.at,p.pos);}
      if(inc>0)G.devLog.push({name:p.name,pos:p.pos,yr:p.yr,was,now:p.ovr,inc:p.ovr-was});
    }
    while(you.roster.length<9){const w=newPlayer(you.prestige,0,{walkOn:true});you.roster.push(w);G.devLog.push({name:w.name,pos:w.pos,yr:0,was:w.ovr,now:w.ovr,inc:0,walk:true});}
    you.roster.sort((a,b)=>b.ovr-a.ovr);
    G.teams.forEach(t=>t.ovr=calcOvr(t));
  }
  if(st===5){ // transfer portal opens: a real pursuit
    G.portal=[];G.portalWk=0;
    const byP=[...G.teams].sort((a,b)=>b.prestige-a.prestige);
    for(let i=0;i<24;i++){
      const src=pick(G.teams.filter(t=>t.id!==you.id));
      const p=newPlayer(ri(58,86),ri(1,2));
      p.ret=false;p.stars=0;
      const suit=shuffle(byP.slice(0,Math.min(220,byP.length))).filter(t=>t.id!==you.id).slice(0,3).map(t=>({tid:t.id,pts:ri(2,10)}));
      G.portal.push({p,from:src.name,want:pick(WANTS),suitors:suit,intU:0,eff:0,res:null});
    }
    G.portal.sort((a,b)=>b.p.ovr-a.p.ovr);
  }
  if(st===6){ // job offers
    G.jobOffers=[];
    const cur=you.prestige,rep=G.coach.rep;
    const open=G.teams.filter(t=>t.openJob&&t.id!==you.id);
    for(const t of open){
      if(G.coach.fired){if(t.prestige<=rep+6)G.jobOffers.push(t.id);}
      else if(t.prestige<=rep+12&&t.prestige>=cur+2)G.jobOffers.push(t.id);
    }
    G.jobOffers=shuffle(G.jobOffers).slice(0,4);
    if(G.coach.fired&&G.jobOffers.length<2){
      const fallback=shuffle(G.teams.filter(t=>t.id!==you.id&&t.prestige<=Math.max(56,rep)&&!G.jobOffers.includes(t.id))).slice(0,2-G.jobOffers.length);
      for(const t of fallback){t.openJob=true;t.coach=newCoachAI(t.prestige,false);G.jobOffers.push(t.id);}
    }
    G.pendingJob=G.coach.fired;
  }
  G.offStage++;
  saveGame();
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function tb(t,showRank){
  return `<span class="badge click" onclick="event.stopPropagation();viewTeam(${t.id})"><span class="tdot" style="background:${t.color}"></span>${showRank&&t.rank?`<span class="dim xs mono">${t.rank}</span> `:""}${t.name}</span>`;

function you(){return G.teams[G.coach.teamId];}

function ppg(p){return p.s.g?f1(p.s.pts/p.s.g):"0.0";}

function playerTags(p){
  let s="";
  if(p.inj>0)s+='<span class="tag tag-out">OUT '+p.inj+'w</span>';

  if(p.gem===-1)s+='<span class="tag tag-bust">Bust</span>';
  if(p.walkOn)s+='<span class="tag tag-walk">Walk-on</span>';
  return s;
}

function mainBtnLabel(){
  switch(G.phase){
    case"preseason":return G.board.length<3?"Set Recruiting Board":"Tip Off Season";
    case"regular":return G.event?"Decision Needed":"Sim Week "+(G.week+1);
    case"confT":return"Sim Championship Week";
    case"ncaa":return G.ncaa.stage==="selection"?"Reveal Bracket":"Sim "+RDNAMES[G.ncaa.roundIdx];
    case"post":return"Continue to Offseason";
    case"off":{
      if(G.offStage===6&&(G.portalWk||0)<3)return"Sim Portal Round "+((G.portalWk||0)+1)+"/3";
      const lbl=["Retention Window","Run Departures","Coaching Carousel","Signing Day","Player Development","Open Transfer Portal","Job Market","Start "+yearLbl(G.seasonYear+1)];
      return G.offStage<7?lbl[G.offStage]:lbl[7];
    }
  }
  return"Continue";
}
function mainAct(){
  if(UI.busy)return;
  switch(G.phase){
    case"preseason":
      if(G.board.length<3){UI.recruitGate=true;UI.screen="recruiting";break;}
      UI.recruitGate=false;UI.screen="home";
      G.phase="regular";addNews("Tip-off! The "+yearLbl(G.seasonYear)+" season is underway.","info");saveGame();break;
    case"regular":if(G.event){UI.screen="home";break;}simWeek();break;
    case"confT":simConfTourneys();UI.screen="bracket";break;
    case"ncaa":simNcaaRound();UI.screen=G.phase==="post"?"review":"bracket";break;
    case"post":G.phase="off";G.offStage=0;runOffStage();UI.screen="offseason";break;
    case"off":
      if(G.offStage===6&&(G.portalWk||0)<3){simPortalWeek();UI.screen="offseason";break;}
      if(G.offStage<7){runOffStage();UI.screen="offseason";}
      else{if(G.pendingJob){UI.screen="offseason";render();return;}startNextSeason();UI.screen="home";}
      break;
  }
  render();
}

function vSchedule(){

function vRecruiting(){
  const t=you();

  const board=boardRecs();
  const lvlChip=(r,l,lbl,dis)=>`<span class="chip ${(r.level||0)===l?"on":""}" style="${dis?"opacity:.4;pointer-events:none":""}" onclick="setLevel(${r.id},${l})">${lbl}</span>`;
  const boardHtml=board.map(r=>{
    const rival=r.suitors.reduce((m,s)=>s.pts>m.pts?s:m,{pts:0,tid:null});
    const tot=Math.max(1,r.intU+rival.pts);
    const yPct=Math.round(100*r.intU/tot);
    const priFull=priCount()>=priCap()&&(r.level||0)!==2;
    const warmFull=warmCount()>=warmCap()&&(r.level||0)===0;
    const visitBtn=r.visited?'<button class="btn btn-g btn-sm" disabled>Visited</button>'
      :r.visitWk?`<button class="btn btn-g btn-sm" disabled>Visit Wk ${r.visitWk}</button>`

    return `<div class="rowline" style="flex-wrap:wrap;gap:6px">

        <div class="xs dim">rated ${r.sc2?r.ovr:r.sc1?r.shown:"?"} · pot ${r.sc2?potGrade(r.pot):"?"} · wants: ${r.sc2||r.visited?r.want:"?"} · ${r.contactWks||0} wks contact</div></span>
      <span style="flex:1;min-width:130px"><div class="meter"><div class="meter-f" style="width:${yPct}%"></div></div>
        <div class="xs dim">you ${Math.round(r.intU)} · rival ${rival.tid!=null?G.teams[rival.tid].abbr+" "+Math.round(rival.pts):"—"}</div></span>
      <span>${lvlChip(r,0,"Cold")}${lvlChip(r,1,"Warm",warmFull)}${lvlChip(r,2,"Priority",priFull||warmFull)}</span>
      <span>${visitBtn} <button class="btn btn-g btn-sm" onclick="dropBoard(${r.id})">Drop</button></span>
    </div>`;
  }).join("");
  const filt=UI.starFilter,pf=UI.posFilter;

    return `<tr><td class="num dim">${r.rk}</td><td>${r.name}${r.gen?'<span class="tag tag-gen">Gen</span>':""}<div class="xs dim">${r.hometown}</div></td>

  }).join("");

function exportSlot(n){
  store.get(slotKey(n)).then(r=>{
    try{
      const d=JSON.parse(r.value);
      const blob=new Blob([r.value],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="hardwood-dynasty-"+(d.teams[d.coach.teamId].abbr||"save")+"-"+String(yearLbl(d.seasonYear)).replace(/[^0-9]/g,"")+"-slot"+n+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }catch(e){alert("Could not export this slot.");}
  }).catch(()=>alert("Could not export this slot."));
}
function handleImportFile(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed||!parsed.coach||!parsed.teams||!Array.isArray(parsed.teams)){alert("That doesn't look like a Hardwood Dynasty save file.");return;}
      UI.importPending=parsed;
      render();
    }catch(err){alert("Couldn't read that file — make sure it's an exported Hardwood Dynasty save.");}
  };
  reader.readAsText(file);
  input.value="";
}
function confirmImport(n){
  if(!UI.importPending)return;
  let migrated;
  try{migrated=migrate(JSON.parse(JSON.stringify(UI.importPending)));}catch(e){alert("This save couldn't be loaded.");UI.importPending=null;render();return;}
  store.set(slotKey(n),JSON.stringify(migrated)).then(()=>{
    UI.importPending=null;
    refreshSlots().then(render);
  }).catch(()=>alert("Could not write to that slot."));
}
function cancelImport(){UI.importPending=null;render();}

function gotoScr(s){UI.screen=s;UI.retArm=false;render();}

function setLevel(rid,l){
  const r=G.recruits.find(x=>x.id===rid);if(!r||r.signed!=null)return;
  if(l===2&&r.level!==2&&priCount()>=priCap())return;
  if(l>=1&&(r.level||0)===0&&warmCount()>=warmCap())return;
  r.level=l;saveGame();render();
}
function scheduleVisit(rid){
  const r=G.recruits.find(x=>x.id===rid);if(!r||r.visited||r.visitWk||r.signed!=null)return;
  if(G.visitsLeft<=0)return;
  let wk=Math.max(G.week+1,1);
  const taken=new Set(G.recruits.filter(x=>x.visitWk).map(x=>x.visitWk));
  while(taken.has(wk))wk++;
  if(wk>REG_WEEKS)return;
  r.visitWk=wk;G.visitsLeft--;
  if((r.level||0)===0)r.level=1;
  saveGame();render();
}
function addBoard(rid){
  if(G.board.length>=BOARD_MAX)return;
  const r=G.recruits.find(x=>x.id===rid);if(!r||r.signed!=null)return;
  G.board.push(rid);
  if(!r.sc1&&rnd()<G.coach.skills.sco*0.06)r.sc1=true;
  render();
}
function dropBoard(rid){
  G.board=G.board.filter(id=>id!==rid);
  const r=G.recruits.find(x=>x.id===rid);
  if(r){r.level=0;if(r.visitWk){r.visitWk=null;G.visitsLeft++;}}
  render();
}
function upSkill(k){
  const C=G.coach,cost=C.skills[k];
  if(C.skills[k]>=10||C.sp<cost)return;
  C.sp-=cost;C.skills[k]++;

function moraleTag(p){const m=p.morale||70;return m>=75?'<span class="good">High</span>':m>=55?'<span class="muted">OK</span>':'<span class="bad">Low</span>';}
function openGame(w,i){UI.gameOpen=(UI.gameOpen&&UI.gameOpen.w===w&&UI.gameOpen.i===i)?null:{w,i};render();}
function retainPlayer(i){
  const e=G.retention&&G.retention[i];if(!e||e.done||e.failed)return;
  if((G.appealsLeft||0)<=0)return;
  G.appealsLeft--;
  const p=you().roster.find(x=>x.id===e.pid);
  const odds=(e.kind==="NBA Draft"?0.30:0.55)+G.coach.skills.cha*0.05;
  if(rnd()<odds){
    e.done=true;
    if(p){p.retained=true;p.leaving=false;p.morale=clamp((p.morale||70)+6,20,99);}
    addNews((p?p.name:"A player")+" buys in after a personal appeal \u2014 he's running it back.","recruit");
  }else{
    e.failed=true;
    addNews((p?p.name:"A player")+" hears you out but keeps his options open.","recruit");
  }
  saveGame();render();
}
function hireAsst(mi){
  const c=G.staffMarket&&G.staffMarket[mi];if(!c)return;
  let slot=G.staff.findIndex(a=>!a);
  if(slot<0)slot=(G.staff[0].lvl<=G.staff[1].lvl)?0:1;
  const old=G.staff[slot];
  G.staff[slot]=c;G.staffMarket.splice(mi,1);

function portalBudget(){return 10+G.coach.skills.rec*2+asstLvl("Recruiting");}
function usedPortal(){return (G.portal||[]).reduce((s,e)=>s+(e.res?0:(e.eff||0)),0);}
function setPortalEff(i,d){
  const e=G.portal&&G.portal[i];if(!e||e.res)return;
  if(d>0&&usedPortal()>=portalBudget())return;
  e.eff=clamp((e.eff||0)+d,0,5);render();
}
function simPortalWeek(){
  const yt=you();const wpct=(yt.w+yt.l)?yt.w/(yt.w+yt.l):0.5;
  for(const e of G.portal||[]){
    if(e.res)continue;
    for(const s of e.suitors)s.pts+=(G.teams[s.tid].prestige/10)*(0.35+rnd()*0.55);
    if(e.eff>0){
      let mult=1;
      if(e.want==="Playing Time"){const comp=yt.roster.filter(p=>p.pos===e.p.pos&&p.ovr>=e.p.ovr-3).length;mult*=comp<=1?1.3:0.8;}
      if(e.want==="Winning")mult*=0.6+wpct*0.9;
      if(e.want==="Development")mult*=0.72+G.coach.skills.dev*0.08+asstLvl("Development")*0.05;
      if(e.want==="Loyalty")mult*=1+0.1*(G.portalWk||0);
      if(e.want==="Spotlight")mult*=0.55+yt.prestige/85;
      e.intU+=e.eff*(0.55+yt.prestige/150+G.coach.skills.cha*0.05)*2.1*mult*(0.8+rnd()*0.4);
    }
  }
  G.portalWk=(G.portalWk||0)+1;
  if(G.portalWk>=3)resolvePortal();
  saveGame();
}
function resolvePortal(){
  const yt=you();
  for(const e of G.portal||[]){
    if(e.res)continue;
    const cands=e.suitors.map(s=>({tid:s.tid,pts:Math.max(1,s.pts)}));
    if(e.eff>0&&e.intU>0)cands.push({tid:yt.id,pts:Math.max(1,e.intU*1.12)});
    const tot=cands.reduce((s,c)=>s+Math.pow(c.pts,1.5),0);
    let roll=rnd()*tot,winner=cands[0].tid;
    for(const c of cands){roll-=Math.pow(c.pts,1.5);if(roll<=0){winner=c.tid;break;}}
    if(winner===yt.id&&yt.roster.length<ROSTER_MAX){
      e.res="you";yt.roster.push(e.p);
      addNews(e.p.name+" ("+e.p.ovr+" OVR, via "+e.from+") commits to "+yt.name+" out of the portal!","recruit");
    }else{
      e.res=(winner===yt.id)?-1:winner;
      if(e.eff>0&&winner!==yt.id)addNews(e.p.name+" chooses "+G.teams[winner].name+" over your portal pitch.","recruit");
    }
  }
  yt.roster.sort((a,b)=>b.ovr-a.ovr);yt.ovr=calcOvr(yt);
  addNews("The transfer portal window closes.","info");
}

function pedStr(p){return p.walkOn?"walk-on":p.stars?starStr(p.stars)+" #"+p.rkN:"unranked";}
function fanFavorites(t){
  const played=t.roster.filter(p=>p.s.g>0);
  const maxG=played.length?Math.max(...played.map(p=>p.s.g)):0;
  const used=new Set();
  const out=[];
  const add=(p,role,stat)=>{if(p&&!used.has(p)){out.push({p,role,stat});used.add(p);}};
  const frosh=[...t.roster].filter(p=>p.yr===0).sort((a,b)=>b.pot-a.pot)[0];
  if(frosh)add(frosh,"Freshman of the Future",frosh.pot>=85?"Elite upside":frosh.pot>=72?"Building fast":"Long-term project");
  const walk=[...t.roster].filter(p=>p.walkOn).sort((a,b)=>(b.s.g||0)-(a.s.g||0)||b.ovr-a.ovr)[0];
  if(walk)add(walk,"Walk-On Hero",walk.s.g>0?"Earning real minutes":"Grinding for a shot");
  if(maxG>0){
    const iron=played.filter(p=>p.s.g>=maxG&&!(p.inj>0)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(iron)add(iron,"Iron Man","Hasn't missed a game");
  }
  const roleCands=played.filter(p=>(p.s.pts/p.s.g)<14);
  const glue=[...roleCands].sort((a,b)=>((b.s.ast+b.s.reb)/b.s.g)-((a.s.ast+a.s.reb)/a.s.g))[0];
  if(glue)add(glue,"Glue Guy","Does the little things");
  const flashy=[...t.roster].filter(p=>p.gem===1||p.gen).sort((a,b)=>b.ovr-a.ovr)[0];
  if(flashy)add(flashy,"Human Highlight Reel",flashy.gen?"Generational talent":"Diamond in the rough");
  const vet=[...t.roster].filter(p=>p.yr>=3).sort((a,b)=>(b.career.pts||0)-(a.career.pts||0))[0];
  if(vet)add(vet,"Program Cornerstone","Been here through it all");
  if(!out.length){
    const top=[...t.roster].sort((a,b)=>b.ovr-a.ovr)[0];
    if(top)add(top,"One to Watch",top.ovr+" OVR");
  }
  return out.slice(0,3);
}

  <div class="rowline"><span class="muted">Career record</span><span class="mono">${c.w||0}–${c.l||0} (${f1(100*(c.w||0)/(((c.w||0)+(c.l||0))||1))}%)</span></div>
  <div class="rowline"><span class="muted">National titles</span><span class="mono gold">${c.chips||0}</span></div>
  <div class="rowline"><span class="muted">Final Fours</span><span class="mono">${c.f4||0}</span></div>
  <div class="rowline"><span class="muted">Conference titles</span><span class="mono">${c.confT||0} tourney · ${c.confRS||0} regular</span></div>
  <div class="rowline"><span class="muted">Players drafted</span><span class="mono">${c.drafted||0}</span></div>
  <div class="rowline"><span class="muted">Tenure at ${t.abbr}</span><span class="mono">year ${(c.tenure||0)+1}</span></div>
  <div class="regionh">Hall of Fame pace</div>
  <div class="meter"><div class="meter-f" style="width:${clamp(100*hp.total/COACH_HOF,0,100)}%"></div></div>
  <div class="xs dim" style="margin-top:3px">${hp.total} / ${COACH_HOF} legacy points${isU?" — through last completed season":""}</div>`;
}
function migrate(d){
  if(d.v>=9)return d;
  if(!(d.v>=3)){
    d.style=d.style||{tempo:"Balanced",scheme:"Balanced"};
    if(d.visitsLeft==null)d.visitsLeft=6;
    d.portal=d.portal||null;
    d.coach.career.confRS=d.coach.career.confRS||0;
    for(const t of d.teams){
      if(!t.style)t.style={tempo:pick(TEMPOS),scheme:pick(SCHEMES)};
      const c=t.coach;
      if(c.full&&/^Coach /.test(c.name))c.name=c.full;
      c.drafted=c.drafted||0;c.confRS=c.confRS||0;c.tw=c.tw||0;
      for(const p of t.roster){if(!p.at){p.at=genAttrs(p.pos,p.ovr);p.arch=archetype(p.at,p.pos);}if(!p.inj)p.inj=0;}
    }
    if(d.teams.every(t=>t.rival==null)){
      for(const c of CONFS){const ids=d.teams.filter(t=>t.conf===c).map(t=>t.id);
        for(let i=0;i+1<ids.length;i+=2){d.teams[ids[i]].rival=ids[i+1];d.teams[ids[i+1]].rival=ids[i];}}
    }
    if(d.recruits)for(const r of d.recruits){if(!r.at){r.at=genAttrs(r.pos,r.ovr);r.arch=archetype(r.at,r.pos);}if(r.visited==null)r.visited=false;if(r.shown==null)r.shown=r.ovr;}
    if(d.phase==="off"&&d.offStage>=4)d.offStage++;
  }
  d.nil=d.nil||{budget:600,spent:0};
  d.staff=(d.staff&&d.staff.length)?d.staff:[newAsst(60),newAsst(50)];
  d.staffMarket=d.staffMarket||[newAsst(70),newAsst(60),newAsst(50),newAsst(45)];
  d.tree=d.tree||[];
  d.rotation=d.rotation||"Balanced Nine";
  d.training=d.training||"Shooting";
  d.event=null;d.evUsed=d.evUsed||[];d.buff=null;
  d.recruitBoost=0;d.scandal=null;d.retention=null;
  d.records=d.records||{career:[],season:[],game:[]};
  d.trophies=d.trophies||[];
  if(d.stintStart==null)d.stintStart=d.teams[d.coach.teamId].prestige;
  d.lastRecap=d.lastRecap||null;
  for(const t of d.teams)for(const p of t.roster){if(p.morale==null)p.morale=ri(60,80);p.retained=false;if(p.leaving==null)p.leaving=false;if(p.usageUp==null)p.usageUp=false;}
  if(d.recruits)for(const r of d.recruits){if(r.want==null){r.want=pick(WANTS);r.ask=r.stars===5?ri(400,900):r.stars===4?ri(150,400):r.stars===3?ri(40,150):ri(0,50);r.offer=0;r.wksOn=0;}}
  if(!(d.v>=4)&&d.phase==="off"&&d.offStage>=1)d.offStage++;
  // v5: NIL removed, full-D1 history, bracketed NIT, portal pursuit
  delete d.nil;
  if(d.appealsLeft==null)d.appealsLeft=0;
  if(d.recruits)for(const r of d.recruits){if(r.want==="NIL"||r.want==null)r.want=pick(WANTS);delete r.ask;delete r.offer;}
  if(d.retention)for(const e of d.retention){delete e.cost;if(e.failed==null)e.failed=false;}
  d.portalWk=3;
  if(d.portal&&d.portal.length&&d.portal[0]&&d.portal[0].st!==undefined)d.portal=null;
  if(d.nit){if(!d.nit.rounds)d.nit.rounds=[];if(d.nit.alive===undefined)d.nit.alive=null;}
  for(const t of d.teams){if(t.histW==null){const c=COLLEGES.find(x=>x[0]===t.name);t.histW=(c&&c[5]!=null)?c[5]:Math.round((70+t.prestige*0.55)*25*(0.40+t.prestige/260));t.histNatty=(c&&c[6])||0;t.histConf=(c&&c[7]!=null)?c[7]:Math.max(0,Math.round((t.prestige-42)/3));}}
  // v6: living record book, pedigrees, pitch-level recruiting, headlines & fan feed
  {
    const o=d.records||{};
    const nr=freshRecords();
    const mg=(list,arr)=>{if(arr)for(const e of arr)upsertRec(list,e);};
    QUIET_REC=true;
    mg(nr.pts.career,o.career||(o.pts&&o.pts.career));
    mg(nr.pts.season,o.season||(o.pts&&o.pts.season));
    mg(nr.pts.game,o.game||(o.pts&&o.pts.game));
    if(o.reb)mg(nr.reb.career,o.reb.career);
    if(o.ast)mg(nr.ast.career,o.ast.career);
    mg(nr.coachW,o.coachW);mg(nr.coachTitles,o.coachTitles);
    QUIET_REC=false;
    d.records=nr;
  }
  d.headlines=d.headlines||[];d.feed=d.feed||[];
  for(const t of d.teams)for(const p of t.roster){
    if(p.prevOvr==null)p.prevOvr=p.ovr;
    if(p.rkN==null){const proj=p.ovr-p.yr*2.2;
      if(!p.stars)p.stars=p.walkOn?0:(proj>=78?5:proj>=71?4:proj>=64?3:proj>=57?2:0);
      p.rkN=p.stars===5?ri(1,15):p.stars===4?ri(16,70):p.stars===3?ri(71,250):p.stars===2?ri(251,500):0;}
  }
  if(d.recruits)for(const r of d.recruits){
    if(r.level==null){r.level=r.eff?(r.eff>=4?2:1):0;r.contactWks=r.wksOn||0;r.visitWk=null;r.sc1=!!r.scouted;r.sc2=!!r.scouted;}
    delete r.eff;
  }
  // v7: program record baselines + live fanbase
  for(const t of d.teams){
    if(t.bestStreak==null)t.bestStreak=baseStreak(t.prestige);
    if(t.bestMargin==null)t.bestMargin=baseMargin(t.prestige);
    if(t.bestSeasonW==null)t.bestSeasonW=baseSeasonW(t.prestige);
  }
  d.v=7;
  // v8: repair conference drift across patches (data refresh + rivalry integrity)
  const byName={};for(const c of COLLEGES)byName[c[0]]=c;
  for(const t of d.teams){
    const c=byName[t.name];
    if(c&&t.conf!==c[2])t.conf=c[2];
  }
  for(const t of d.teams){
    const partner=t.rival!=null?d.teams[t.rival]:null;
    if(t.rival==null||!partner||partner.conf!==t.conf||partner.id===t.id){
      const mates=d.teams.filter(x=>x.conf===t.conf&&x.id!==t.id);
      t.rival=mates.length?pick(mates).id:null;
    }
  }
  d.v=8;
  // v9: research-corrected exact all-time win totals + real-world-calibrated fan bases
  for(const t of d.teams){
    const c=byName[t.name];
    if(c&&c[5]!=null)t.histW=c[5];
  }
  assignFanBases(d.teams);
  for(const t of d.teams){t.fans=t.fanBase;t.fansTrend=0;}
  d.v=9;
  return d;
}

function render(){
  const app=document.getElementById("app");
  const same=UI.lastScreen===UI.screen;UI.lastScreen=UI.screen;
  const y=window.scrollY||0;
  let html;
  if(UI.screen==="wizard"&&UI.wiz)html=vWizard();
  else if(!G||UI.screen==="title")html=vTitle();
  else if(UI.screen==="career")html=vCareer();
  else{
    let body="";
    switch(UI.screen){
      case"home":body=vHome();break;case"roster":body=vRoster();break;case"schedule":body=vSchedule();break;
      case"standings":body=vStandings();break;case"rankings":body=vRankings();break;case"recruiting":body=vRecruiting();break;
      case"bracket":body=vBracket();break;case"coach":body=vCoach();break;case"league":body=vLeague();break;
      case"history":body=vHistory();break;case"hof":body=vHof();break;case"saves":body=vSaves();break;
      case"review":body=vReview();break;case"offseason":body=vOffseason();break;
      case"feed":body=vFeed();break;
      default:body=vHome();
    }
    html=vHeader()+`<div class="wrap${same?"":" fade"}">${body}</div>`;
    if(UI.view)html+=vOverlay();
  }
  app.innerHTML=html;
  if(same)window.scrollTo(0,y);else window.scrollTo(0,0);
}

(async function boot(){
  await refreshSlots();
  UI.screen="title";
  render();
})();
</script>

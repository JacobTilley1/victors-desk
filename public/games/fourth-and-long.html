*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070c}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  color:#cfd8ef;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
#wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
#cab{
  position:relative;padding:10px;
  background:linear-gradient(#182438,#0a1018);
  border:2px solid #2f4258;
  box-shadow:0 0 0 2px #05070c, 0 18px 46px rgba(0,0,0,.7);
}
#cab::before{content:"";position:absolute;inset:4px;border:1px solid #243547;pointer-events:none}
canvas{
  display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#070c16;cursor:default;touch-action:manipulation;
  width:min(96vw, 960px);height:auto;
}
#scan{
  position:absolute;inset:10px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.14) 3px, rgba(0,0,0,.14) 4px);
  mix-blend-mode:multiply;
}
body.flat #scan{display:none}

#pad{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.key{
  font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  background:#17243a;color:#cfd8ef;border:2px solid #33485f;
  padding:8px 14px;cursor:pointer;min-width:46px;
}
.key:active,.key.hot{background:#26496a;border-color:#ffbe2e;color:#ffbe2e}
.key.wide{min-width:120px}
#hint{font-size:10.5px;letter-spacing:.09em;color:#6d7f94;text-align:center;line-height:1.7;max-width:720px}
#hint b{color:#a9bed1;font-weight:400}
@media (max-width:700px){ #hint{display:none} .key{padding:10px 12px} }
</style>

/* ============================================================
   FOURTH AND LONG — toolkit
   A 480x270 board instead of the 320x180 the action games use.
   This one is read rather than played, and a 112-character
   question needs the extra room.
   ============================================================ */
var CV, X, W = 480, H = 270;

/* a seeded stream, so a crowd or a shuffle stays put between frames */
function hash32(n) {
  n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) >>> 0;
  n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d) >>> 0;
  return (n ^ (n >>> 15)) >>> 0;
}
function rnd(seed) { return hash32(seed >>> 0) / 4294967296; }

/* splitmix32: a single xorshift round leaves sequential seeds
   visibly correlated, which once made a whole game deterministic */
function mix32(s) {
  s = (s + 0x9e3779b9) >>> 0;
  var z = s;
  z = Math.imul(z ^ (z >>> 16), 0x21f0aaad) >>> 0;
  z = Math.imul(z ^ (z >>> 15), 0x735a2d97) >>> 0;
  return ((z ^ (z >>> 15)) >>> 0) / 4294967296;
}

function pxc(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

/* ---------------- the alphabet ----------------
   5x7 cells. Everything is drawn upper case: a stadium board has
   no lower case either, and it halves the glyph count. The bank
   needs exactly these 46 characters and no others. */
var GLYPH = {
  A: '01110100011000111111100011000110001', B: '11110100011000111110100011000111110',
  C: '01110100011000010000100001000101110', D: '11110100011000110001100011000111110',
  E: '11111100001000011110100001000011111', F: '11111100001000011110100001000010000',
  G: '01110100011000010111100011000101111', H: '10001100011000111111100011000110001',
  I: '11111001000010000100001000010011111', J: '00111000100001000010000101001001100',
  K: '10001100101010011000101001001010001', L: '10000100001000010000100001000011111',
  M: '10001110111010110101100011000110001', N: '10001110011010110011100011000110001',
  O: '01110100011000110001100011000101110', P: '11110100011000111110100001000010000',
  Q: '01110100011000110001101011001001101', R: '11110100011000111110101001001010001',
  S: '01111100001000001110000010000111110', T: '11111001000010000100001000010000100',
  U: '10001100011000110001100011000101110', V: '10001100011000110001100010101000100',
  W: '10001100011000110101101011101110001', X: '10001100010101000100010101000110001',
  Y: '10001100010101000100001000010000100', Z: '11111000010001000100010001000011111',
  0: '01110100011001110101110011000101110', 1: '00100011000010000100001000010001110',
  2: '01110100010000100110010001000011111', 3: '11111000100010000010000011000101110',
  4: '00010001100101010010111110001000010', 5: '11111100001111000001000011000101110',
  6: '00110010001000011110100011000101110', 7: '11111000010001000100001000010000100',
  8: '01110100011000101110100011000101110', 9: '01110100011000101111000010001001100',
  '?': '01110100010000100110001000000000100',
  '!': '00100001000010000100001000000000100',
  '.': '00000000000000000000000000110001100',
  ',': '00000000000000000000001100011000100',
  '-': '00000000000000011111000000000000000',
  "'": '01100011000010000000000000000000000',
  ':': '00000011000110000000011000110000000',
  '(': '00010001000100001000010000010000010',
  ')': '01000001000001000010000100010001000',
  '/': '00001000100010001000100010001000000',
  '&': '01100100101001001100101011001001101',
  '%': '11001110010001000100010001001110011',
  '+': '00000001000010011111001000010000000',
  '"': '10101101010000000000000000000000000',
  ' ': '00000000000000000000000000000000000',

/* the bank uses a curly apostrophe in a few places */
function normalize(s) {
  return String(s).toUpperCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[–—]/g, '-');
}

var TRACK = 1;                                  /* pixels between glyphs */
function charW(sc) { return (5 + TRACK) * sc; }
function textWidth(s, sc) {
  sc = sc || 1;
  var n = normalize(s).length;
  return n * charW(sc) - TRACK * sc;
}
function textAt(s, x, y, col, sc, ctx) {
  sc = sc || 1;
  var c = ctx || X, str = normalize(s), cx = x;
  c.fillStyle = col;
  for (var i = 0; i < str.length; i++) {
    var g = GLYPH[str.charAt(i)];
    if (g) {
      for (var r = 0; r < 7; r++) {
        for (var k = 0; k < 5; k++) {
          if (g.charAt(r * 5 + k) === '1') c.fillRect(x + (cx - x) + k * sc, y + r * sc, sc, sc);
        }
      }
    }
    cx += charW(sc);
  }
  return cx - x - TRACK * sc;
}
function textCenter(s, cx, y, col, sc, ctx) {
  return textAt(s, Math.round(cx - textWidth(s, sc) / 2), y, col, sc, ctx);
}
function textShadow(s, x, y, col, sh, sc, ctx) {
  textAt(s, x + sc, y + sc, sh, sc, ctx);
  return textAt(s, x, y, col, sc, ctx);
}
function textCenterShadow(s, cx, y, col, sh, sc, ctx) {
  var x = Math.round(cx - textWidth(s, sc) / 2);
  textAt(s, x + sc, y + sc, sh, sc, ctx);
  return textAt(s, x, y, col, sc, ctx);
}

/* ---------------- wrapping ----------------
   Breaks on spaces. A single word longer than the line is cut rather
   than allowed to run off the board, which only happens on a couple
   of the longer surnames at large scale. */
function wrapText(s, maxPx, sc) {
  sc = sc || 1;
  var words = normalize(s).split(' ');
  var lines = [], line = '';
  for (var i = 0; i < words.length; i++) {
    var word = words[i];
    var attempt = line ? line + ' ' + word : word;
    if (textWidth(attempt, sc) <= maxPx) { line = attempt; continue; }
    if (line) { lines.push(line); line = ''; }
    while (textWidth(word, sc) > maxPx) {
      var cut = Math.max(1, Math.floor(maxPx / charW(sc)) - 1);
      lines.push(word.slice(0, cut) + '-');
      word = word.slice(cut);
    }
    line = word;
  }
  if (line) lines.push(line);
  return lines;
}

/* the smallest scale at which the text still fits the box, so a short
   question is shown big and a long one shrinks to fit rather than
   spilling off the bottom of the board */
function fitLines(s, maxPx, maxLines, scales) {
  for (var i = 0; i < scales.length; i++) {
    var lines = wrapText(s, maxPx, scales[i]);
    if (lines.length <= maxLines) return { lines: lines, sc: scales[i] };
  }
  var sc = scales[scales.length - 1];
  return { lines: wrapText(s, maxPx, sc).slice(0, maxLines), sc: sc };
}

/* ---------------- sprites ---------------- */
function drawSprite(rows, x, y, pal, flip, scale, ctx) {
  var c = ctx || X;
  scale = scale || 1;
  var h = rows.length, w = rows[0].length;
  for (var r = 0; r < h; r++) {
    for (var i = 0; i < w; i++) {
      var col = pal[rows[r].charAt(flip ? w - 1 - i : i)];
      if (!col) continue;
      c.fillStyle = col;
      c.fillRect((x | 0) + i * scale, (y | 0) + r * scale, scale, scale);
    }
  }
}

/* ---------------- colours ---------------- */
var TURF = '#1f5c2e', TURF_D = '#17431f', CHALK = '#e9f0f7';
var BOARD = '#0a0f1a', BOARD_L = '#141d2f';
var AMBER = '#ffbe2e', GREEN = '#4ade6a', RED = '#ef5a5a', STEEL = '#8fa3c4';
/* ============================================================
   FOURTH AND LONG — the stadium and the board
   The board does the work, so the stadium is a frame around it:
   a strip of crowd above, a strip of turf below, and the big
   screen filling everything between.
   ============================================================ */

var BOARD_X = 14, BOARD_Y = 36, BOARD_W = W - 28, BOARD_H = 196;

/* ---------------- crowd ---------------- */
/* Rows of heads, not noise. A field of random bright pixels reads as
   television static rather than as people. `lift` brightens the whole
   stand when something has just happened. */
function drawCrowd(y0, y1, seed, lift) {
  pxc(X, 0, y0, W, y1 - y0, '#0b1320');
  for (var row = 0, yy = y0 + 1; yy < y1 - 1; yy += 3, row++) {
    var off = row % 2 ? 2 : 0;
    for (var xx = off; xx < W; xx += 4) {
      var r = rnd(seed + xx * 7919 + yy * 104729);
      if (r < 0.22) continue;
      var t = rnd(seed + xx * 31 + yy * 17);
      var col = t > 0.90 ? '#d8c07a' : t > 0.70 ? '#6b7fa4' : t > 0.42 ? '#46587c' : '#2d3b58';
      if (lift > 0 && rnd(seed + xx * 13 + yy * 7 + ((Date.now() / 90) | 0)) < lift) col = '#f2e6b8';
      pxc(X, xx, yy, 2, 2, col);
    }
    pxc(X, 0, yy + 2, W, 1, 'rgba(0,0,0,0.26)');
  }
}

/* ---------------- floodlights ---------------- */
function drawLights() {
  for (var i = 0; i < 2; i++) {
    var lx = i ? W - 54 : 34;
    pxc(X, lx - 1, 4, 2, 14, '#4a5b7e');
    pxc(X, lx - 11, 0, 22, 7, '#67799c');
    for (var b = 0; b < 5; b++) pxc(X, lx - 9 + b * 4, 1, 3, 4, '#fff3c4');
    X.globalAlpha = 0.055;
    X.fillStyle = '#ffeaa0';
    X.beginPath();
    X.moveTo(lx, 7); X.lineTo(lx - 86, 70); X.lineTo(lx + 86, 70);
    X.closePath(); X.fill();
    X.globalAlpha = 1;
  }
}

/* ---------------- turf ---------------- */
function drawTurf(y0, h) {
  for (var i = 0; i < h; i++) {
    var t = i / h;
    pxc(X, 0, y0 + i, W, 1, (Math.floor(t * 5) % 2) ? '#1c5429' : '#216232');
  }
  /* yard lines running away from the camera */
  for (var k = 0; k <= 9; k++) {
    var x = Math.round(k * (W / 9));
    pxc(X, x, y0, 1, h, 'rgba(233,240,247,0.30)');
  }
  pxc(X, 0, y0, W, 1, 'rgba(255,255,255,0.35)');
  pxc(X, 0, y0 + 1, W, 1, 'rgba(0,0,0,0.25)');
}

/* ---------------- the board itself ---------------- */
/* `flash` tints the whole screen: green when a question is right,
   red when it is wrong. `bulb` drives the chase lights round the rim. */
function drawBoard(t, flash, bulb) {
  var x = BOARD_X, y = BOARD_Y, w = BOARD_W, h = BOARD_H;

  /* the gantry holding it up */
  pxc(X, x + 24, y - 10, 5, 12, '#3b485f');
  pxc(X, x + w - 29, y - 10, 5, 12, '#3b485f');

  /* steel surround */
  pxc(X, x - 6, y - 6, w + 12, h + 12, '#2b3650');
  pxc(X, x - 6, y - 6, w + 12, 2, '#55657f');
  pxc(X, x - 6, y + h + 4, w + 12, 2, '#161e2e');

  /* the bulbs chasing round the rim */
  var step = 10, i = 0;
  function bulbAt(bx, by) {
    var on = ((i++ + bulb) % 4) === 0;
    pxc(X, bx, by, 3, 3, on ? '#ffe9a8' : '#4b566e');
  }
  for (var bx = x - 4; bx < x + w + 2; bx += step) { bulbAt(bx, y - 5); bulbAt(bx, y + h + 2); }
  for (var by = y - 1; by < y + h; by += step) { bulbAt(x - 5, by); bulbAt(x + w + 2, by); }

  /* the screen */
  pxc(X, x, y, w, h, BOARD);
  /* a faint scan of pixel rows, so it reads as a screen */
  for (var sy = y; sy < y + h; sy += 3) pxc(X, x, sy, w, 1, 'rgba(255,255,255,0.016)');

  if (flash) {
    X.globalAlpha = flash.a;
    pxc(X, x, y, w, h, flash.col);
    X.globalAlpha = 1;
  }
}

/* a panel inside the board */
function panel(x, y, w, h, fill, edge) {
  pxc(X, x, y, w, h, fill);
  if (edge) {
    pxc(X, x, y, w, 1, edge);
    pxc(X, x, y + h - 1, w, 1, edge);
    pxc(X, x, y, 1, h, edge);
    pxc(X, x + w - 1, y, 1, h, edge);
  }
}

/* ---------------- confetti, for a run worth celebrating ---------------- */
var bits = [];
function burst(n, cx, cy, cols) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
    bits.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
      t: 0, life: 0.8 + Math.random() * 0.9,
      col: cols[(Math.random() * cols.length) | 0],
    });
  }
  if (bits.length > 260) bits.splice(0, bits.length - 260);
}
function stepBits(dt) {
  for (var i = bits.length - 1; i >= 0; i--) {
    var b = bits[i];
    b.t += dt;
    if (b.t > b.life) { bits.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 220 * dt; b.vx *= 0.99;
  }
}
function drawBits() {
  for (var i = 0; i < bits.length; i++) {
    var b = bits[i];
    X.globalAlpha = Math.max(0, 1 - b.t / b.life);
    pxc(X, Math.round(b.x), Math.round(b.y), 2, 2, b.col);
  }
  X.globalAlpha = 1;
}

/* ---------------- the whole backdrop ---------------- */
/* The footer carries live text, so it is a dark bar rather than turf.
   The first pass put the hint line straight onto the grass, where grey
   on green and green on green were both unreadable. */
var FOOT_Y = H - 22;

function drawStadium(st) {
  pxc(X, 0, 0, W, H, '#070c16');
  drawCrowd(0, 32, 4242, st.roar || 0);
  drawLights();
  drawTurf(BOARD_Y + BOARD_H + 6, FOOT_Y - (BOARD_Y + BOARD_H + 6));
  pxc(X, 0, FOOT_Y, W, H - FOOT_Y, 'rgba(5,9,16,0.92)');
  pxc(X, 0, FOOT_Y, W, 1, AMBER);
}
/* ============================================================
   FOURTH AND LONG — rules
   Three modes over one bank of 500 questions. The questions are
   used exactly as supplied; the only thing this file does to them
   is choose an order and shuffle which slot the right answer sits
   in, so nobody learns that it is usually B.
   ============================================================ */

var GAME = 'nfl-trivia';

var MODE_LIST = ['sudden', 'drill', 'ten'];
var MODES = {
  sudden: {
    name: 'SUDDEN DEATH',
    line1: 'ONE WRONG ANSWER AND THE RUN IS OVER.',
    line2: 'HOW FAR CAN YOU GET?',
  },
  drill: {
    name: 'TWO MINUTE DRILL',
    line1: 'TWO MINUTES ON THE CLOCK. RIGHT ADDS',
    line2: 'THREE SECONDS, WRONG COSTS FIVE.',
  },
  ten: {
    name: 'QUICK TEN',
    line1: 'TEN QUESTIONS, NO PENALTY FOR A MISS.',
    line2: 'ONE SCORE OUT OF TEN.',
  },
};

var DRILL_SECONDS = 120;
var TEN_COUNT = 10;
var REVEAL_HOLD = 0.45;        /* you cannot skip past the answer instantly */

/* ---------------- shuffling ----------------
   Fisher-Yates driven by splitmix32, so a run is reproducible from
   its seed and the order is genuinely flat. */
function shuffled(n, seed) {
  var a = [];
  for (var i = 0; i < n; i++) a.push(i);
  for (var k = n - 1; k > 0; k--) {
    var j = Math.floor(mix32(seed + k * 2654435761) * (k + 1));
    var t = a[k]; a[k] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------------- state ---------------- */
var G = null;
var view = 'menu';
var menu = { sel: 0 };

var BEST = {
  sudden: { streak: 0, score: 0 },
  drill: { correct: 0, score: 0 },
  ten: { correct: 0, score: 0, plays: 0 },
};

function startMode(id) {
  var seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  G = {
    mode: id,
    seed: seed,
    order: shuffled(BANK.length, seed),
    cursor: 0,
    asked: 0,
    correct: 0,
    streak: 0,
    bestStreak: 0,
    score: 0,
    clock: id === 'drill' ? DRILL_SECONDS : 0,
    phase: 'ask',
    q: null,
    picked: -1,
    revealT: 0,
    flash: null,
    roar: 0,
    shake: 0,
    notice: null,
    noticeT: 0,
    newBest: false,
    lastGain: 0,
  };
  view = 'play';
  nextQuestion(G);
  return G;
}

/* Pull the next question and shuffle its four options. The bank's own
   answer spread is close to even already, but shuffling removes any
   chance of a positional tell and costs nothing. */
function nextQuestion(G) {
  /* Five hundred questions is more than anyone will see in a run, but a
     long Two Minute Drill streak could in principle reach the end. Reshuffle
     and start again rather than repeating in the same order. */
  if (G.cursor >= G.order.length) {
    G.order = shuffled(BANK.length, (G.seed + G.asked * 2654435761) >>> 0);
    G.cursor = 0;
  }
  var row = BANK[G.order[G.cursor]];
  G.cursor++;

  var n = row[1].length;
  var slots = [];
  for (var i = 0; i < n; i++) slots.push(i);
  for (var k = n - 1; k > 0; k--) {
    var j = Math.floor(mix32(G.seed + G.asked * 7919 + k * 104729) * (k + 1));
    var t = slots[k]; slots[k] = slots[j]; slots[j] = t;
  }
  var opts = [], answer = 0;
  for (var s = 0; s < n; s++) {
    opts.push(row[1][slots[s]]);
    if (slots[s] === row[2]) answer = s;
  }

  G.q = { text: row[0], opts: opts, answer: answer };
  G.phase = 'ask';
  G.picked = -1;
  G.revealT = 0;
  G.lastGain = 0;
  return G.q;
}

/* points: a flat hundred, plus a streak bonus that is worth chasing
   without letting an early run decide the whole board */
function pointsFor(streak) {
  return 100 + Math.min(300, Math.max(0, streak - 1) * 25);
}

function answerWith(G, i) {
  if (!G || G.phase !== 'ask' || !G.q) return null;
  if (i < 0 || i >= G.q.opts.length) return null;

  G.picked = i;
  G.phase = 'reveal';
  G.revealT = 0;
  G.asked++;

  var right = i === G.q.answer;
  if (right) {
    G.correct++;
    G.streak++;
    if (G.streak > G.bestStreak) G.bestStreak = G.streak;
    G.lastGain = pointsFor(G.streak);
    G.score += G.lastGain;
    G.flash = { col: '#2f7d45', a: 0.42 };
    G.roar = 0.5;
    if (G.mode === 'drill') G.clock = Math.min(DRILL_SECONDS, G.clock + 3);
    if (G.streak > 0 && G.streak % 5 === 0) {
      G.notice = G.streak + ' IN A ROW';
      G.noticeT = 0;
    }
  } else {
    G.streak = 0;
    G.lastGain = 0;
    G.flash = { col: '#7d2f2f', a: 0.42 };
    G.shake = 0.32;
    if (G.mode === 'drill') G.clock = Math.max(0, G.clock - 5);
  }
  return right;
}

/* has the run finished? */
function runOver(G) {
  if (!G) return false;
  if (G.mode === 'sudden') return G.phase === 'reveal' && G.picked >= 0 && G.picked !== G.q.answer;
  if (G.mode === 'ten') return G.asked >= TEN_COUNT;
  if (G.mode === 'drill') return G.clock <= 0;
  return false;
}

/* move on from a revealed answer */
function advance(G) {
  if (!G || G.phase !== 'reveal' || G.revealT < REVEAL_HOLD) return false;
  if (runOver(G)) { endRun(); return true; }
  nextQuestion(G);
  return false;
}

function endRun() {
  view = 'over';
  G.newBest = false;
  var b = BEST[G.mode];
  if (G.mode === 'sudden') {
    if (G.correct > b.streak) { b.streak = G.correct; G.newBest = true; }
    if (G.score > b.score) { b.score = G.score; G.newBest = true; }
  } else if (G.mode === 'drill') {
    if (G.correct > b.correct) { b.correct = G.correct; G.newBest = true; }
    if (G.score > b.score) { b.score = G.score; G.newBest = true; }
  } else {
    b.plays = (b.plays || 0) + 1;
    if (G.correct > b.correct) { b.correct = G.correct; G.newBest = true; }
    if (G.score > b.score) { b.score = G.score; G.newBest = true; }
  }
  if (G.newBest) burst(90, W / 2, 120, ['#ffbe2e', '#4ade6a', '#e9f0f7', '#8fa3c4']);
  saveBest();
}

/* ---------------- the frame ---------------- */
function update(dt) {
  if (!G || view !== 'play') return;

  if (G.flash) {
    G.flash.a -= dt * 1.1;
    if (G.flash.a <= 0) G.flash = null;
  }
  if (G.roar > 0) G.roar = Math.max(0, G.roar - dt * 0.9);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.4);
  if (G.notice) {
    G.noticeT += dt;
    if (G.noticeT > 1.8) G.notice = null;
  }
  if (G.phase === 'reveal') G.revealT += dt;

  if (G.mode === 'drill') {
    G.clock = Math.max(0, G.clock - dt);
    /* the clock only stops once the answer on screen has been read */
    if (G.clock <= 0 && (G.phase === 'ask' || G.revealT >= REVEAL_HOLD)) endRun();
  }
}

/* ---------------- saving ----------------
   The site route takes a game, a key and a string. Signed out it
   answers 401, which is not an error here: the score still lives in
   this browser, it just does not follow you to another one. */
var LOCAL_KEY = 'fal:local:best';

function saveBest() {
  try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(BEST)); } catch (e) { /* private mode */ }
  if (typeof window.fetch !== 'function') return;
  try {
    window.fetch('/api/games/saves', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ game: GAME, key: 'best', value: JSON.stringify(BEST) }),
    }).catch(function () { });
  } catch (e) { /* offline */ }
}

function mergeBest(obj) {
  if (!obj || typeof obj !== 'object') return;
  for (var k in BEST) {
    if (!obj[k]) continue;
    for (var f in BEST[k]) {
      if (typeof obj[k][f] === 'number' && obj[k][f] > BEST[k][f]) BEST[k][f] = obj[k][f];
    }
  }
}

function loadBest() {
  try {
    var raw = window.localStorage.getItem(LOCAL_KEY);
    if (raw) mergeBest(JSON.parse(raw));
  } catch (e) { /* ignore */ }
  /* No fetch at all is survivable: the score still lives in this browser.
     Letting it throw here would take the whole boot sequence down with it
     and leave a blank board, which is a far worse trade. */
  if (typeof window.fetch !== 'function') return Promise.resolve();
  return window.fetch('/api/games/saves?game=' + GAME + '&key=best')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (d && d.value) mergeBest(JSON.parse(d.value));
    })
    .catch(function () { });
}
/* ============================================================
   FOURTH AND LONG — screens, input, loop
   ============================================================ */

var UIst = { t: 0 };
var LETTER = ['A', 'B', 'C', 'D'];

/* where the four answer rows live inside the board */
var ROW_X = BOARD_X + 10, ROW_W = BOARD_W - 20;
var ROW_H = 24, ROW_GAP = 4, ROW_TOP = BOARD_Y + 82;
function rowRect(i) {
  return { x: ROW_X, y: ROW_TOP + i * (ROW_H + ROW_GAP), w: ROW_W, h: ROW_H };
}

function clockText(s) {
  var m = Math.floor(Math.max(0, s) / 60), r = Math.floor(Math.max(0, s) % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}

/* ---------------- the strip across the top ---------------- */
function drawHud() {
  pxc(X, 0, 0, W, 20, 'rgba(5,9,16,0.88)');
  pxc(X, 0, 20, W, 1, AMBER);

  var m = MODES[G.mode];
  textAt(m.name, 8, 7, AMBER, 1);

  if (G.mode === 'drill') {
    var low = G.clock <= 15;
    var t = clockText(G.clock);
    var blink = low && Math.floor(UIst.t * 4) % 2 === 0;
    textCenter(t, W / 2, 5, blink ? '#ffffff' : (low ? RED : '#ffffff'), 2);
    /* the clock as a bar, because a number alone does not feel like time */
    var frac = Math.max(0, Math.min(1, G.clock / DRILL_SECONDS));
    pxc(X, W / 2 - 60, 17, 120, 2, '#2b3650');
    pxc(X, W / 2 - 60, 17, Math.round(120 * frac), 2, low ? RED : GREEN);
  } else if (G.mode === 'ten') {
    textCenter('QUESTION ' + Math.min(TEN_COUNT, G.asked + (G.phase === 'reveal' ? 0 : 1)) +
      ' OF ' + TEN_COUNT, W / 2, 7, '#ffffff', 1);
  } else {
    textCenter('STREAK ' + G.streak, W / 2, 7, G.streak >= 5 ? AMBER : '#ffffff', 1);
  }

  var sc = String(G.score);
  textAt(sc, W - 8 - textWidth(sc, 1), 7, '#ffffff', 1);
  var lbl = 'SCORE';
  textAt(lbl, W - 8 - textWidth(sc, 1) - 6 - textWidth(lbl, 1), 7, STEEL, 1);
}

/* ---------------- the question ---------------- */
function drawQuestion() {
  var box = { x: BOARD_X + 10, y: BOARD_Y + 8, w: BOARD_W - 20, h: 64 };
  panel(box.x, box.y, box.w, box.h, '#111b2d', '#263a52');

  /* a marker bar down the left of the question, like a broadcast lower third */
  pxc(X, box.x, box.y, 3, box.h, AMBER);

  /* Long questions step down a size rather than spilling off the board. */
  var fit = fitLines(G.q.text, box.w - 18, 4, [2, 1]);
  var lineH = fit.sc === 2 ? 17 : 10;
  var totalH = fit.lines.length * lineH;
  var y = Math.round(box.y + (box.h - totalH) / 2) + 1;
  for (var i = 0; i < fit.lines.length; i++) {
    textCenter(fit.lines[i], box.x + box.w / 2 + 1, y + i * lineH, '#ffffff', fit.sc);
  }
}

/* ---------------- the four answers ---------------- */
function drawAnswers() {
  for (var i = 0; i < G.q.opts.length; i++) {
    var r = rowRect(i);
    var isAnswer = i === G.q.answer;
    var isPick = i === G.picked;
    var revealed = G.phase === 'reveal';

    var fill = '#16213a', edge = '#2c3a57', ink = '#dde6f5', badge = '#2c3a57', badgeInk = '#9fb0cc';

    if (revealed) {
      if (isAnswer) {
        fill = '#1d5c33'; edge = GREEN; ink = '#eafff0'; badge = GREEN; badgeInk = '#06240f';
      } else if (isPick) {
        fill = '#5c1d1d'; edge = RED; ink = '#ffeaea'; badge = RED; badgeInk = '#2a0606';
      } else {
        fill = '#101828'; edge = '#1e2a40'; ink = '#56657f'; badge = '#1e2a40'; badgeInk = '#56657f';
      }
    } else if (hover === i) {
      fill = '#20304f'; edge = AMBER; ink = '#ffffff'; badge = AMBER; badgeInk = '#1a1403';
    }

    panel(r.x, r.y, r.w, r.h, fill, edge);
    /* the letter badge */
    pxc(X, r.x + 1, r.y + 1, 22, r.h - 2, badge);
    textCenter(LETTER[i], r.x + 12, r.y + (r.h - 7) / 2, badgeInk, 1);

    /* the option text, shrunk only if it has to be */
    var maxW = r.w - 34;
    var sc = textWidth(G.q.opts[i], 2) <= maxW ? 2 : 1;
    var lines = sc === 2 ? [normalize(G.q.opts[i])] : wrapText(G.q.opts[i], maxW, 1);
    if (lines.length > 2) lines = lines.slice(0, 2);
    var lh = sc === 2 ? 0 : 9;
    var top = Math.round(r.y + (r.h - (lines.length === 1 ? 7 * sc : lines.length * lh)) / 2);
    for (var k = 0; k < lines.length; k++) textAt(lines[k], r.x + 29, top + k * lh, ink, sc);

    /* a tick or a cross once it is settled */
    if (revealed && (isAnswer || isPick)) {
      var mx = r.x + r.w - 16, my = r.y + (r.h - 9) / 2;
      if (isAnswer) {
        pxc(X, mx + 1, my + 5, 2, 2, GREEN); pxc(X, mx + 3, my + 7, 2, 2, GREEN);
        pxc(X, mx + 5, my + 5, 2, 2, GREEN); pxc(X, mx + 7, my + 2, 2, 2, GREEN);
        pxc(X, mx + 9, my, 2, 2, GREEN);
      } else {
        for (var d = 0; d < 5; d++) {
          pxc(X, mx + 1 + d * 2, my + d * 2, 2, 2, RED);
          pxc(X, mx + 9 - d * 2, my + d * 2, 2, 2, RED);
        }
      }
    }
  }
}

/* ---------------- the line under the answers ---------------- */
function drawFoot() {
  var y = FOOT_Y + 8;
  if (G.phase === 'ask') {
    textCenter('PRESS A B C D, 1 2 3 4, OR CLICK AN ANSWER', W / 2, y, '#9fb0cc', 1);
    return;
  }
  var right = G.picked === G.q.answer;
  if (right) {
    var gain = '+' + G.lastGain;
    var tail = G.streak > 1 ? '   STREAK ' + G.streak : '';
    textCenter(gain + tail + '   PRESS TO CONTINUE', W / 2, y, GREEN, 1);
  } else if (G.mode === 'sudden') {
    textCenter('THAT IS THE RUN   PRESS TO SEE THE DAMAGE', W / 2, y, RED, 1);
  } else {
    textCenter('THE ANSWER WAS ' + LETTER[G.q.answer] + '   PRESS TO CONTINUE', W / 2, y, RED, 1);
  }
}

/* ---------------- a streak shout ---------------- */
function drawNotice() {
  if (!G.notice) return;
  var a = G.noticeT < 1.2 ? 1 : Math.max(0, 1 - (G.noticeT - 1.2) * 1.6);
  X.globalAlpha = a;
  var w = textWidth(G.notice, 2) + 24;
  pxc(X, W / 2 - w / 2, 26, w, 18, 'rgba(5,9,16,0.9)');
  pxc(X, W / 2 - w / 2, 26, w, 1, AMBER);
  pxc(X, W / 2 - w / 2, 43, w, 1, AMBER);
  textCenter(G.notice, W / 2, 31, AMBER, 2);
  X.globalAlpha = 1;
}

/* ---------------- menu ---------------- */
function bestLine(id) {
  var b = BEST[id];
  if (id === 'sudden') return b.streak ? 'BEST RUN ' + b.streak : '';
  if (id === 'drill') return b.correct ? 'BEST ' + b.correct + ' RIGHT' : '';
  return b.correct ? 'BEST ' + b.correct + '/10' : '';
}

function drawMenu() {
  drawStadium({ roar: 0 });
  drawBoard(UIst.t, null, Math.floor(UIst.t * 6));

  textCenterShadow('FOURTH AND LONG', W / 2, BOARD_Y + 14, AMBER, '#5a3f00', 3);
  textCenter('FIVE HUNDRED QUESTIONS OF PRO FOOTBALL', W / 2, BOARD_Y + 40, '#9fb0cc', 1);
  pxc(X, BOARD_X + 60, BOARD_Y + 52, BOARD_W - 120, 1, '#2c3a57');

  for (var i = 0; i < MODE_LIST.length; i++) {
    var id = MODE_LIST[i], m = MODES[id], on = menu.sel === i;
    var y = BOARD_Y + 62 + i * 22;
    panel(BOARD_X + 24, y, BOARD_W - 48, 19, on ? '#20304f' : '#131d31', on ? AMBER : '#263a52');
    textAt(on ? '>' : ' ', BOARD_X + 32, y + 6, AMBER, 1);
    textAt(m.name, BOARD_X + 44, y + 6, on ? '#ffffff' : '#9fb0cc', 1);
    var bt = bestLine(id);
    if (bt) textAt(bt, BOARD_X + BOARD_W - 32 - textWidth(bt, 1), y + 6, on ? GREEN : '#4d6a58', 1);
  }

  var sel = MODES[MODE_LIST[menu.sel]];
  var py = BOARD_Y + 134;
  panel(BOARD_X + 24, py, BOARD_W - 48, 30, 'rgba(5,9,16,0.75)', '#263a52');
  pxc(X, BOARD_X + 24, py, 3, 30, AMBER);
  textAt(sel.line1, BOARD_X + 34, py + 7, '#dde6f5', 1);
  textAt(sel.line2, BOARD_X + 34, py + 18, '#dde6f5', 1);

  if (Math.floor(UIst.t * 2) % 2 === 0) {
    textCenter('UP DOWN TO CHOOSE     PRESS TO PLAY', W / 2, FOOT_Y + 8, '#ffffff', 1);
  }
}

/* ---------------- the end of a run ---------------- */
function drawOver() {
  drawStadium({ roar: G.newBest ? 0.35 : 0 });
  drawBoard(UIst.t, null, Math.floor(UIst.t * 6));

  var pct = G.asked ? Math.round((G.correct / G.asked) * 100) : 0;
  var head = G.mode === 'sudden' ? 'RUN OVER' : G.mode === 'drill' ? 'TIME' : 'THAT IS TEN';
  textCenterShadow(head, W / 2, BOARD_Y + 12, G.newBest ? GREEN : AMBER, '#3a2a00', 3);

  if (G.newBest) textCenter('A NEW BEST', W / 2, BOARD_Y + 38, GREEN, 1);
  else textCenter(MODES[G.mode].name, W / 2, BOARD_Y + 38, '#9fb0cc', 1);

  var stats = [
    ['CORRECT', G.correct + ' OF ' + G.asked],
    ['ACCURACY', pct + '%'],
    ['BEST STREAK', String(G.bestStreak)],
    ['SCORE', String(G.score)],
  ];
  for (var i = 0; i < stats.length; i++) {
    var y = BOARD_Y + 56 + i * 20;
    panel(BOARD_X + 40, y, BOARD_W - 80, 17, i === 3 ? '#1b2c22' : '#131d31',
      i === 3 ? '#2f6b45' : '#263a52');
    textAt(stats[i][0], BOARD_X + 50, y + 5, STEEL, 1);
    var v = stats[i][1];
    textAt(v, BOARD_X + BOARD_W - 50 - textWidth(v, i === 3 ? 2 : 1), y + (i === 3 ? 2 : 5),
      i === 3 ? AMBER : '#ffffff', i === 3 ? 2 : 1);
  }

  drawBits();
  if (Math.floor(UIst.t * 2) % 2 === 0) {
    textCenter('PRESS TO PLAY AGAIN     ESC FOR THE MENU', W / 2, FOOT_Y + 8, '#ffffff', 1);
  }
}

/* ---------------- play ---------------- */
function drawPlay() {
  var sx = 0, sy = 0;
  if (G.shake > 0) {
    sx = Math.round((Math.random() - 0.5) * G.shake * 14);
    sy = Math.round((Math.random() - 0.5) * G.shake * 8);
  }
  X.save();
  X.translate(sx, sy);
  drawStadium(G);
  drawBoard(UIst.t, G.flash, Math.floor(UIst.t * 6));
  drawQuestion();
  drawAnswers();
  X.restore();
  drawHud();
  drawFoot();
  drawNotice();
  drawBits();
}

function draw() {
  X.clearRect(0, 0, W, H);
  if (view === 'menu') { drawMenu(); return; }
  if (view === 'over') { drawOver(); return; }
  if (!G) { drawMenu(); return; }
  drawPlay();
}

/* ---------------- input ---------------- */
var hover = -1;

function press() {
  if (view === 'menu') { startMode(MODE_LIST[menu.sel]); return; }
  if (view === 'over') { startMode(G.mode); return; }
  if (!G) return;
  if (G.phase === 'reveal') advance(G);
}

function choose(i) {
  if (view !== 'play' || !G || G.phase !== 'ask') return;
  answerWith(G, i);
}

function moveMenu(d) {
  if (view !== 'menu') return;
  menu.sel = (menu.sel + d + MODE_LIST.length) % MODE_LIST.length;
}

function toMenu() {
  view = 'menu';
  G = null;
  bits.length = 0;
}

/* which answer row is under a point, in board pixels */
function rowAt(px, py) {
  for (var i = 0; i < 4; i++) {
    var r = rowRect(i);
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i;
  }
  return -1;
}

function wire() {
  CV = document.getElementById('c');
  X = CV.getContext('2d');
  X.imageSmoothingEnabled = false;

  function toBoard(e) {
    var rect = CV.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height),
    };
  }

  CV.addEventListener('mousemove', function (e) {
    if (view !== 'play' || !G || G.phase !== 'ask') { hover = -1; return; }
    var p = toBoard(e);
    hover = rowAt(p.x, p.y);
    CV.style.cursor = hover >= 0 ? 'pointer' : 'default';
  });
  CV.addEventListener('mouseleave', function () { hover = -1; });

  CV.addEventListener('click', function (e) {
    var p = toBoard(e);
    if (view === 'play' && G && G.phase === 'ask') {
      var i = rowAt(p.x, p.y);
      if (i >= 0) { choose(i); return; }
      return;
    }
    press();
  });

  /* touch: the click handler covers taps, but the hover state has to be
     cleared or a finger leaves a row lit after it has gone */
  CV.addEventListener('touchend', function () { hover = -1; }, { passive: true });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (e.repeat) return;
    if (k === 'Escape') { if (view !== 'menu') toMenu(); return; }
    if (view === 'menu') {
      if (k === 'ArrowUp' || k === 'w' || k === 'W') { moveMenu(-1); e.preventDefault(); return; }
      if (k === 'ArrowDown' || k === 's' || k === 'S') { moveMenu(1); e.preventDefault(); return; }
    }
    var idx = 'abcd'.indexOf(String(k).toLowerCase());
    if (idx < 0) idx = '1234'.indexOf(k);
    if (idx >= 0 && view === 'play' && G && G.phase === 'ask') { choose(idx); e.preventDefault(); return; }
    if (k === ' ' || k === 'Enter') { press(); e.preventDefault(); }
  });

  document.getElementById('kA').addEventListener('click', function () { choose(0); });
  document.getElementById('kB').addEventListener('click', function () { choose(1); });
  document.getElementById('kC').addEventListener('click', function () { choose(2); });
  document.getElementById('kD').addEventListener('click', function () { choose(3); });
  document.getElementById('kGo').addEventListener('click', function () { press(); });
  document.getElementById('kM').addEventListener('click', function () {
    document.body.classList.toggle('flat');
  });
}

/* ---------------- loop ---------------- */
var last = 0;
function frame(ts) {
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
  last = ts;
  UIst.t += dt;
  update(dt);
  stepBits(dt);
  draw();
  window.requestAnimationFrame(frame);
}

wire();
Promise.resolve(loadBest()).catch(function () { }).then(function () {
  window.requestAnimationFrame(frame);
});
</script>
